<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>VAYGO — Spin & Win</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;600;700;800&family=Righteous&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;
  background:#060E1C;
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Sans',sans-serif;
  overflow:hidden;
}

.screen{
  width:100%;max-width:390px;
  height:100dvh;
  position:relative;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:0 24px;
  background:linear-gradient(160deg,#060E1C 0%,#0a1a08 50%,#060E1C 100%);
}

/* Animated background glow */
.screen::before{
  content:'';
  position:absolute;
  width:300px;height:300px;
  background:radial-gradient(circle,rgba(212,245,106,0.08) 0%,transparent 70%);
  top:50%;left:50%;
  transform:translate(-50%,-60%);
  animation:pulse 4s ease-in-out infinite;
  pointer-events:none;
}
@keyframes pulse{0%,100%{opacity:0.5;transform:translate(-50%,-60%) scale(1);}50%{opacity:1;transform:translate(-50%,-60%) scale(1.2);}}

/* BACK */
.back-btn{
  position:absolute;top:14px;left:14px;z-index:30;
  width:34px;height:34px;border-radius:50%;
  background:rgba(212,245,106,0.08);
  border:1px solid rgba(212,245,106,0.2);
  display:flex;align-items:center;justify-content:center;
  color:#d4f56a;font-size:18px;text-decoration:none;
}

/* TOP LABEL */
.top-section{
  text-align:center;
  margin-bottom:28px;
  position:relative;z-index:1;
}
.vaygo-label{
  font-family:'Anton',sans-serif;
  font-size:36px;letter-spacing:6px;
  color:#d4f56a;
  text-shadow:0 0 30px rgba(212,245,106,0.5),0 0 60px rgba(212,245,106,0.2);
  line-height:1;
}
.sub-label{
  font-family:'Righteous',sans-serif;
  font-size:11px;letter-spacing:4px;
  color:rgba(255,255,255,0.5);
  text-transform:uppercase;
  margin-top:4px;
}

/* MACHINE BODY */
.machine{
  width:100%;
  background:rgba(212,245,106,0.04);
  border:1px solid rgba(212,245,106,0.15);
  border-radius:24px;
  padding:20px;
  position:relative;z-index:1;
  backdrop-filter:blur(20px);
  box-shadow:
    0 0 0 1px rgba(212,245,106,0.05),
    0 20px 60px rgba(0,0,0,0.5),
    inset 0 1px 0 rgba(212,245,106,0.08);
}

/* Corner accents */
.machine::before,.machine::after{
  content:'';
  position:absolute;
  width:12px;height:12px;
  border-color:rgba(212,245,106,0.4);
  border-style:solid;
}
.machine::before{top:10px;left:10px;border-width:2px 0 0 2px;border-radius:4px 0 0 0;}
.machine::after{bottom:10px;right:10px;border-width:0 2px 2px 0;border-radius:0 0 4px 0;}

/* REELS ROW */
.reels-row{
  display:flex;gap:10px;margin-bottom:14px;
}

.reel{
  flex:1;height:110px;
  overflow:hidden;
  border-radius:12px;
  background:rgba(0,0,0,0.4);
  border:1px solid rgba(212,245,106,0.12);
  position:relative;
  box-shadow:inset 0 0 20px rgba(0,0,0,0.5);
}

/* Reel top/bottom fade */
.reel::before,.reel::after{
  content:'';position:absolute;left:0;right:0;height:30%;z-index:5;pointer-events:none;
}
.reel::before{top:0;background:linear-gradient(to bottom,rgba(0,0,0,0.8),transparent);}
.reel::after{bottom:0;background:linear-gradient(to top,rgba(0,0,0,0.8),transparent);}

/* Payline */
.reels-row::after{
  content:'';
  position:absolute;
  left:20px;right:20px;
  top:50%;transform:translateY(-50%);
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(212,245,106,0.3),transparent);
  pointer-events:none;
  z-index:6;
}

.reel-inner{
  display:flex;flex-direction:column;
  will-change:transform;
}

.reel-item{
  height:110px;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  flex-shrink:0;
  font-family:'Anton',sans-serif;
  text-align:center;
  line-height:1;
}

/* STATS BAR */
.stats-bar{
  display:flex;gap:6px;margin-bottom:14px;
}
.stat-box{
  flex:1;text-align:center;
  background:rgba(212,245,106,0.04);
  border:1px solid rgba(212,245,106,0.1);
  border-radius:8px;padding:5px 6px;
}
.stat-lbl{font-size:7px;font-weight:800;letter-spacing:1.5px;color:rgba(212,245,106,0.35);text-transform:uppercase;display:block;}
.stat-val{font-family:'Righteous',sans-serif;font-size:13px;color:rgba(212,245,106,0.7);display:block;margin-top:1px;}

/* SPIN BUTTON */
.spin-btn{
  width:100%;height:52px;
  background:linear-gradient(180deg,#d4f56a 0%,#8fc20a 50%,#5a8000 100%);
  border:none;border-radius:14px;
  color:#0a1a00;
  font-family:'Anton',sans-serif;font-size:20px;letter-spacing:4px;
  cursor:pointer;
  box-shadow:
    0 4px 0 #2d4000,
    0 8px 30px rgba(212,245,106,0.3),
    inset 0 1px 0 rgba(255,255,255,0.3);
  transition:transform 0.1s,box-shadow 0.1s;
  position:relative;overflow:hidden;
}
.spin-btn::after{
  content:'';position:absolute;
  top:0;left:-100%;width:60%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,0.2),transparent);
  transform:skewX(-20deg);
  animation:shimmer 3s infinite;
}
@keyframes shimmer{0%{left:-100%;}100%{left:200%;}}

.spin-btn:active:not(:disabled){
  transform:translateY(4px);
  box-shadow:0 0 0 #2d4000,0 4px 10px rgba(212,245,106,0.2);
}
.spin-btn:disabled{opacity:0.5;cursor:not-allowed;}

/* WIN FLASH */
@keyframes winFlash{
  0%,100%{box-shadow:inset 0 0 20px rgba(0,0,0,0.5);}
  50%{box-shadow:inset 0 0 20px rgba(212,245,106,0.2),0 0 20px rgba(212,245,106,0.3);}
}
.reel.win{animation:winFlash 0.3s ease 4;}

/* QR MODAL */
#qrModal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.97);padding:16px;overflow-y:auto;}
#qrModal.show{display:flex;}
.qr-box{background:#050e04;border-radius:24px;padding:24px 20px;text-align:center;width:100%;max-width:320px;border:2px solid #d4f56a;box-shadow:0 0 60px rgba(212,245,106,0.2);}
.qr-your-prize{font-size:10px;color:#d4f56a;text-transform:uppercase;letter-spacing:3px;margin-bottom:8px;font-family:'DM Sans',sans-serif;}
.qr-prize-val{font-family:'Anton',sans-serif;font-size:64px;line-height:1;color:#fff;margin-bottom:4px;}
.qr-rest-name{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:14px;font-family:'DM Sans',sans-serif;}
.qr-code-pill{background:#0a1a08;border-radius:10px;padding:8px 18px;font-family:monospace;font-size:17px;font-weight:700;color:#d4f56a;letter-spacing:2px;margin-bottom:6px;display:inline-block;border:1px solid rgba(212,245,106,0.2);}
.qr-valid-txt{font-size:12px;color:#d4f56a;font-weight:700;margin-bottom:14px;font-family:'DM Sans',sans-serif;}
#qr-canvas{display:flex;justify-content:center;margin:0 auto 10px;}
.qr-hint{font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:14px;font-family:'DM Sans',sans-serif;}
.qr-min-box{background:rgba(212,245,106,0.05);border:1px solid rgba(212,245,106,0.2);border-radius:10px;padding:10px;font-size:11px;color:rgba(255,255,255,0.6);font-family:'DM Sans',sans-serif;}
.qr-min-box strong{color:#d4f56a;}
.qr-back-btn{margin-top:16px;width:100%;padding:14px;background:linear-gradient(180deg,#d4f56a,#8fc20a);border:none;border-radius:50px;color:#0a1a00;font-family:'Anton',sans-serif;font-size:15px;letter-spacing:2px;cursor:pointer;box-shadow:0 4px 0 #2d4000;}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyAnfS-H1Ci1WaAnjoBTA9IJFYSklAk-okM",
  authDomain:"vaygo-app.firebaseapp.com",
  projectId:"vaygo-app",
  storageBucket:"vaygo-app.firebasestorage.app",
  appId:"vaygo-app"
});
const db=firebase.firestore();
const VENUE_CONFIGS={
  lobster:{id:'lobster',name:'The Original Lobster House'},
  buccanos:{id:'buccanos',name:'Buccanos Beach Club'},
  azulmadera:{id:'azulmadera',name:'Azul Madera'},
  guidos:{id:'guidos',name:"Guido's Restaurant"},
};
const _vp=(new URLSearchParams(window.location.search)).get('venue')||'lobster';
const _vc=VENUE_CONFIGS[_vp]||VENUE_CONFIGS['lobster'];
const REST_ID=_vc.id, REST_NAME=_vc.name, MIN_PURCHASE="$20 USD";
const PRIZES=[{label:"10% OFF",color:"#d4f56a"},{label:"15% OFF",color:"#a8d400"},{label:"20% OFF",color:"#78b000"}];

function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const s=n=>Array.from({length:n},()=>c[Math.floor(Math.random()*c.length)]).join('');return'VYG-'+s(4)+'-'+s(4);}
function getExpiry(){const n=new Date(),e=new Date(n);e.setHours(23,59,59,0);if(e<=n)e.setDate(e.getDate()+1);return e;}

async function saveAndShowQR(prize){
  const prizeLabel=prize.label;
  const today=new Date().toISOString().slice(0,10);
  const spinKey=REST_ID+'_slot2_'+today;
  const gameKey=REST_ID+'_game_'+today;
  try{
    const snap=await db.collection('codes').where('gameKey','==',gameKey).limit(1).get();
    if(!snap.empty){const d=snap.docs[0].data();showQR(d.code,d.prize,d.expiresAt);return;}
  }catch(e){}
  const code=genCode(),expires=getExpiry();
  try{
    await db.collection('codes').doc(code).set({code,prize:prizeLabel,restId:REST_ID,restName:REST_NAME,spinKey,gameKey,game:'slot2',spunAt:firebase.firestore.FieldValue.serverTimestamp(),expiresAt:expires.toISOString(),used:false,uid:'anon_'+Date.now()});
  }catch(e){console.error(e);}
  showQR(code,prizeLabel,expires.toISOString());
}

function showQR(code,prize,expiresISO){
  const t=new Date(expiresISO).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('qr-prize').textContent=prize;
  document.getElementById('qr-rest').textContent=REST_NAME;
  document.getElementById('qr-code-txt').textContent=code;
  document.getElementById('qr-valid').textContent='Valid until: '+t+' today';
  const qrDiv=document.getElementById('qr-canvas');qrDiv.innerHTML='';
  new QRCode(qrDiv,{text:code,width:220,height:220,colorDark:'#000',colorLight:'#fff'});
  setTimeout(()=>{const img=qrDiv.querySelector('img');if(img){img.style.padding='10px';img.style.background='#fff';img.style.borderRadius='10px';img.style.display='block';}},100);
  document.getElementById('qrModal').classList.add('show');
}

function goBackToVenue(){
  const vm={lobster:'lobster.html',buccanos:'buccanos.html',azulmadera:'azulmadera.html',guidos:'guidos.html'};
  window.location.href=vm[_vp]||'lobster.html';
}
</script>
</head>
<body>

<a id="backBtn" href="lobster.html" class="back-btn" onclick="event.preventDefault();goBackToVenue()">‹</a>

<div class="screen">
  <div class="top-section">
    <div class="vaygo-label">VAYGO</div>
    <div class="sub-label">Spin · Win · Redeem</div>
  </div>

  <div class="machine">
    <div class="reels-row" style="position:relative;">
      <div class="reel" id="r0"><div class="reel-inner" id="ri0"></div></div>
      <div class="reel" id="r1"><div class="reel-inner" id="ri1"></div></div>
      <div class="reel" id="r2"><div class="reel-inner" id="ri2"></div></div>
    </div>

    <div class="stats-bar">
      <div class="stat-box"><span class="stat-lbl">Credits</span><span class="stat-val">1</span></div>
      <div class="stat-box"><span class="stat-lbl">Bet</span><span class="stat-val">MAX</span></div>
      <div class="stat-box"><span class="stat-lbl">Win</span><span class="stat-val" id="winVal">—</span></div>
    </div>

    <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN NOW</button>
  </div>
</div>

<div id="qrModal">
  <div class="qr-box">
    <div class="qr-your-prize">🎉 YOUR PRIZE</div>
    <div class="qr-prize-val" id="qr-prize"></div>
    <div class="qr-rest-name" id="qr-rest"></div>
    <div class="qr-code-pill" id="qr-code-txt"></div>
    <div class="qr-valid-txt" id="qr-valid"></div>
    <div id="qr-canvas"></div>
    <div class="qr-hint">Show this QR to the staff to redeem</div>
    <div class="qr-min-box">⚠️ Min purchase: <strong>$20 USD</strong></div>
    <button class="qr-back-btn" onclick="goBackToVenue()">← BACK TO VENUE</button>
  </div>
</div>

<script>
const ITEMS=[
  {pct:"10%",color:"#d4f56a"},
  {pct:"15%",color:"#a8d400"},
  {pct:"20%",color:"#5a8000"},
];
const ITEM_H=110;
let spinning=false,done=false;

function buildReels(){
  const fs=Math.max(22,Math.round(ITEM_H*0.28));
  const fo=Math.max(10,Math.round(ITEM_H*0.10));
  for(let r=0;r<3;r++){
    const inner=document.getElementById('ri'+r);
    inner.innerHTML='';
    inner.style.cssText='display:flex;flex-direction:column;will-change:transform;';
    const all=[...ITEMS,...ITEMS,...ITEMS,...ITEMS,...ITEMS];
    all.forEach(item=>{
      const div=document.createElement('div');
      div.style.cssText=`height:${ITEM_H}px;min-height:${ITEM_H}px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;`;
      div.innerHTML=`
        <span style="font-family:'Anton',sans-serif;font-size:${fs}px;color:${item.color};text-shadow:0 0 20px ${item.color},0 0 40px ${item.color}50;line-height:1;">${item.pct}</span>
        <span style="font-family:'DM Sans',sans-serif;font-weight:800;font-size:${fo}px;color:${item.color};opacity:0.7;letter-spacing:3px;">OFF</span>
      `;
      inner.appendChild(div);
    });
    inner.style.transform=`translateY(-${r*ITEM_H}px)`;
    inner.style.transition='none';
  }
}
buildReels();

// Check if already played
async function checkAlreadyPlayed(){
  const today=new Date().toISOString().slice(0,10);
  const gameKey=REST_ID+'_game_'+today;
  try{
    const snap=await db.collection('codes').where('gameKey','==',gameKey).limit(1).get();
    if(!snap.empty){
      const d=snap.docs[0].data();
      done=true;
      document.getElementById('spinBtn').disabled=true;
      document.getElementById('spinBtn').textContent='COME BACK TOMORROW';
      showQR(d.code,d.prize,d.expiresAt);
    }
  }catch(e){}
}
checkAlreadyPlayed();

function spin(){
  if(spinning||done)return;
  spinning=true;
  document.getElementById('spinBtn').disabled=true;
  playSpinSound();
  const prize=PRIZES[Math.floor(Math.random()*PRIZES.length)];
  const prizePercent=prize.label.split('%')[0]+'%';
  const total=ITEMS.length;
  let baseIdx=total*3;
  for(let i=total*3;i<total*4;i++){
    if(ITEMS[i%total].pct===prizePercent){baseIdx=i;break;}
  }
  [0,1,2].forEach((r,idx)=>{
    const inner=document.getElementById('ri'+r);
    const dur=1200+idx*350;
    const myLand=baseIdx+r;
    inner.style.transition=`transform ${dur}ms cubic-bezier(0.17,0.67,0.12,1.0)`;
    inner.style.transform=`translateY(-${myLand*ITEM_H}px)`;
    setTimeout(()=>{
      playStopSound();
      document.getElementById('r'+r).classList.add('win');
      if(idx===2){
        document.getElementById('winVal').textContent=prize.label;
        setTimeout(()=>{
          spinning=false;done=true;
          playWinSound();doConfetti();
          setTimeout(()=>saveAndShowQR(prize),800);
        },300);
      }
    },dur);
  });
}

let _ac=null;
function getAC(){if(!_ac)_ac=new(window.AudioContext||window.webkitAudioContext)();if(_ac.state==='suspended')_ac.resume();return _ac;}
function makeNoise(ac,dur){const b=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate);const d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function playSpinSound(){try{const ac=getAC(),now=ac.currentTime;for(let i=0;i<20;i++){const t=i*0.055,b=makeNoise(ac,0.04),s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1200+Math.random()*500;f.Q.value=4;const g=ac.createGain();g.gain.setValueAtTime(0.35,now+t);g.gain.exponentialRampToValueAtTime(0.001,now+t+0.038);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(now+t);s.stop(now+t+0.05);}}catch(e){}}
function playStopSound(){try{const ac=getAC(),now=ac.currentTime,b=makeNoise(ac,0.08),s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=3;const g=ac.createGain();g.gain.setValueAtTime(0.45,now);g.gain.exponentialRampToValueAtTime(0.001,now+0.07);s.connect(f);f.connect(g);g.connect(ac.destination);s.start(now);s.stop(now+0.09);}catch(e){}}
function playWinSound(){try{const ac=getAC(),now=ac.currentTime;[[0,523],[0.13,659],[0.26,784],[0.39,1047],[0.52,1319]].forEach(([t,f])=>{const o=ac.createOscillator();o.type='sine';const g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,now+t);g.gain.linearRampToValueAtTime(0.28,now+t+0.02);g.gain.exponentialRampToValueAtTime(0.001,now+t+0.28);o.connect(g);g.connect(ac.destination);o.start(now+t);o.stop(now+t+0.3);});}catch(e){}}
function doConfetti(){const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;';document.body.appendChild(cv);cv.width=innerWidth;cv.height=innerHeight;const ctx=cv.getContext('2d');const C=['#d4f56a','#a8d400','#78b000','#fff','#8fc20a'];const ps=Array.from({length:120},()=>({x:Math.random()*cv.width,y:-20,vx:(Math.random()-.5)*4,vy:2+Math.random()*5,c:C[~~(Math.random()*C.length)],a:Math.random()*6,s:(Math.random()-.5)*.18,w:4+Math.random()*6,h:7+Math.random()*12,al:1}));(function loop(){ctx.clearRect(0,0,cv.width,cv.height);let alive=false;ps.forEach(p=>{if(p.al<=0)return;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;p.vy+=.07;if(p.y>cv.height*.85)p.al-=.03;alive=true;ctx.save();ctx.globalAlpha=p.al;ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});if(alive)requestAnimationFrame(loop);else cv.remove();})();}
</script>
</body>
</html>
