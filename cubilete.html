<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>VAYGO — Cubilete Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:'DM Sans',sans-serif;}

.app{
  width:100%;max-width:430px;height:100dvh;margin:0 auto;
  position:relative;
  background:#000;
  display:flex;flex-direction:column;
}

/* HEADER */
.hdr{height:54px;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;z-index:20;border-bottom:1px solid rgba(201,168,76,0.15);}
.back{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;text-decoration:none;}
.logo-n{font-family:'Anton',sans-serif;font-size:18px;color:#C9A84C;letter-spacing:4px;text-align:center;}
.logo-s{font-size:7px;color:rgba(255,255,255,0.35);letter-spacing:2px;text-align:center;}
.tiros-box{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:4px 10px;text-align:center;}
.tiros-lbl{font-size:7px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;display:block;margin-bottom:3px;}
.tiros-dots{display:flex;gap:4px;justify-content:center;}
.tdot{width:12px;height:12px;border-radius:50%;background:#C9A84C;box-shadow:0 0 5px #C9A84C;transition:all 0.3s;}
.tdot.used{background:#222;box-shadow:none;}

/* GAME AREA — fills everything below header */
.game{flex:1;position:relative;overflow:hidden;background:#000;}

/* STATUS MESSAGE */
.status{position:absolute;top:16px;left:0;right:0;text-align:center;z-index:10;pointer-events:none;}
.status-title{font-family:'Anton',sans-serif;font-size:20px;color:#fff;letter-spacing:2px;text-shadow:0 0 20px rgba(0,200,255,0.6);}
.status-sub{font-size:10px;color:rgba(255,255,255,0.4);margin-top:3px;letter-spacing:1px;}

/* CUP — big, centered */
#cup{
  position:absolute;
  left:50%;top:50%;
  transform:translate(-50%,-50%);
  width:75%;max-width:280px;
  z-index:5;
  cursor:pointer;
  mix-blend-mode:screen;
  transition:filter 0.3s;
}
#cup img{width:100%;display:block;mix-blend-mode:screen;}

/* HINT */
#hint{
  position:absolute;bottom:24px;left:0;right:0;
  text-align:center;z-index:10;
  font-size:11px;color:rgba(0,207,255,0.8);
  letter-spacing:2px;text-transform:uppercase;
  animation:pulse 1.5s infinite;
}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.4;}}

/* SHAKE animation for cup */
@keyframes cupShake{
  0%  {transform:translate(-50%,-50%) rotate(0deg);}
  10% {transform:translate(calc(-50% - 15px),-50%) rotate(-8deg);}
  25% {transform:translate(calc(-50% + 15px),-50%) rotate(8deg);}
  40% {transform:translate(calc(-50% - 12px),-50%) rotate(-6deg);}
  55% {transform:translate(calc(-50% + 12px),-50%) rotate(6deg);}
  70% {transform:translate(calc(-50% - 6px),-50%) rotate(-3deg);}
  85% {transform:translate(calc(-50% + 6px),-50%) rotate(3deg);}
  100%{transform:translate(-50%,-50%) rotate(0deg);}
}
.cup-shaking{animation:cupShake 0.6s ease-in-out;}

/* LIFT cup up and off screen */
@keyframes cupLift{
  0%  {transform:translate(-50%,-50%) rotate(0deg) scale(1);}
  30% {transform:translate(-50%,calc(-50% - 30px)) rotate(-15deg) scale(1.05);}
  100%{transform:translate(-50%,-200%) rotate(-25deg) scale(0.8);opacity:0;}
}
.cup-lifting{animation:cupLift 0.7s ease-in forwards;}

/* DICE — fly out from cup center */
.die{
  position:absolute;
  width:90px;height:90px;
  object-fit:contain;
  mix-blend-mode:screen;
  opacity:0;
  pointer-events:none;
}
@keyframes dieFly0{0%{opacity:0;transform:translate(-50%,-50%) scale(0.2) rotate(0deg);}20%{opacity:1;}100%{opacity:1;transform:translate(calc(-50% - 120px), calc(-50% + 160px)) scale(1) rotate(-30deg);}}
@keyframes dieFly1{0%{opacity:0;transform:translate(-50%,-50%) scale(0.2) rotate(0deg);}20%{opacity:1;}100%{opacity:1;transform:translate(calc(-50% - 50px), calc(-50% + 200px)) scale(1) rotate(15deg);}}
@keyframes dieFly2{0%{opacity:0;transform:translate(-50%,-50%) scale(0.2) rotate(0deg);}20%{opacity:1;}100%{opacity:1;transform:translate(-50%, calc(-50% + 220px)) scale(1) rotate(-10deg);}}
@keyframes dieFly3{0%{opacity:0;transform:translate(-50%,-50%) scale(0.2) rotate(0deg);}20%{opacity:1;}100%{opacity:1;transform:translate(calc(-50% + 50px), calc(-50% + 200px)) scale(1) rotate(20deg);}}
@keyframes dieFly4{0%{opacity:0;transform:translate(-50%,-50%) scale(0.2) rotate(0deg);}20%{opacity:1;}100%{opacity:1;transform:translate(calc(-50% + 120px), calc(-50% + 160px)) scale(1) rotate(-25deg);}}
.die.fly0{animation:dieFly0 0.6s ease-out forwards;}
.die.fly1{animation:dieFly1 0.6s ease-out forwards;animation-delay:0.08s;}
.die.fly2{animation:dieFly2 0.6s ease-out forwards;animation-delay:0.16s;}
.die.fly3{animation:dieFly3 0.6s ease-out forwards;animation-delay:0.24s;}
.die.fly4{animation:dieFly4 0.6s ease-out forwards;animation-delay:0.32s;}

/* Glow on winner die */
.die.winner{filter:drop-shadow(0 0 20px gold) drop-shadow(0 0 40px rgba(255,215,0,0.8));}

/* NAV */
.nav{height:54px;background:rgba(0,0,0,0.98);border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-around;flex-shrink:0;z-index:20;}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.ni .ico{font-size:15px;}
.ni span{font-size:7px;color:rgba(255,255,255,0.3);}
.nc{background:linear-gradient(180deg,#C9A84C,#8B6914);border-radius:50%;width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:-12px;box-shadow:0 0 0 3px #000,0 0 0 4px rgba(201,168,76,0.3);}
.nc .ico{font-size:14px;}
.nc .lbl{font-size:7px;color:#fff;font-weight:700;}

/* PRIZE MODAL */
#prizeModal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.93);}
#prizeModal.show{display:flex;animation:fadeIn 0.35s ease;}
@keyframes fadeIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
.pbox{background:#050005;border-radius:24px;padding:30px 24px;text-align:center;width:300px;border:2px solid #C9A84C;box-shadow:0 0 60px rgba(201,168,76,0.25);}
.pwin-lbl{font-size:10px;color:#00CFFF;text-transform:uppercase;letter-spacing:3px;margin-bottom:14px;}
.prize-die-wrap{width:130px;height:130px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
.prize-die-wrap img{width:100%;mix-blend-mode:screen;animation:prizePulse 1.5s infinite;}
@keyframes prizePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);filter:drop-shadow(0 0 30px gold);}}
.pval{font-family:'Anton',sans-serif;font-size:56px;line-height:1;margin-bottom:6px;}
.pdesc{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:22px;}
.pbtn{background:linear-gradient(180deg,#C9A84C,#8B6914);border:none;border-radius:50px;padding:14px 0;color:#fff;font-family:'Anton',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;width:100%;box-shadow:0 4px 0 #5A4008;}

.confetti-piece{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:200;animation:cFall linear forwards;}
@keyframes cFall{0%{opacity:1;transform:translateY(0) rotate(0);}100%{opacity:0;transform:translateY(100vh) rotate(540deg);}}
</style>
</head>

  <div class="hdr">
    <a href="app.html" class="back">&#8249;</a>
    <div><div class="logo-n">VAYGO</div><div class="logo-s">CUBILETE CHALLENGE</div></div>

    </div>

  <div class="game" id="game">

  <div class="nav">

    <div class="ni"><div class="ico">📍</div><span>MAP</span></div>

  <div id="prizeModal">
    <div class="pbox">
      <div class="pwin-lbl">🎉 ¡GANASTE!</div>
      <div class="prize-die-wrap"><img id="prizeDieImg" src="" alt=""/></div>
      <div class="pval" id="pval"></div>
      <div class="pdesc" id="pdesc"></div>
      <button class="pbtn" onclick="closePrize()">¡GENIAL! 🎉</button>
    </div>
  </div>

</div>

const PRIZES = [
  {img:IMGS.dado_10, label:'10% OFF', desc:'10% de descuento en tu cuenta total', color:'#FF2D9B'},
  {img:IMGS.dado_15, label:'15% OFF', desc:'15% de descuento en tu cuenta total', color:'#33DD33'},
  {img:IMGS.dado_20, label:'20% OFF', desc:'20% de descuento en tu cuenta total', color:'#3A7FFF'},
];

document.getElementById('cupImg').src = IMGS.cubilete;

// Position dice at center of game area
const game = document.getElementById('game');
function positionDice(){
  const gw = game.clientWidth, gh = game.clientHeight;
  for(let i=0;i<5;i++){
    const el = document.getElementById('die'+i);
    el.style.left = (gw/2) + 'px';
    el.style.top  = (gh/2) + 'px';
  }
}
positionDice();
window.addEventListener('resize', positionDice);

let tiro = 0;
let animating = false;
let gameOver = false;
let shakeCount = 0;
let lastShake = 0;

// Accelerometer shake detection
if(window.DeviceMotionEvent){
  window.addEventListener('devicemotion', e=>{
    const a = e.accelerationIncludingGravity;
    if(!a) return;
    const mag = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
    const now = Date.now();
    if(mag > 18 && now - lastShake > 300){
      lastShake = now;
      shakeCount++;
      if(shakeCount >= 2){ shakeCount=0; handleTap(); }
    }
  });
}

// iOS permission
if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
  document.getElementById('game').addEventListener('click', ()=>{
    DeviceMotionEvent.requestPermission().catch(()=>{});
  }, {once:true});
}

function updDots(){
  [0,1,2].forEach(i=>{
    document.getElementById('d'+i).classList.toggle('used', i >= (3-tiro));
  });
}

function handleTap(){
  if(animating || gameOver) return;
  animating = true;

  const cup = document.getElementById('cup');

  if(tiro < 2){
    // Shake only
    cup.classList.add('cup-shaking');
    cup.addEventListener('animationend', ()=>{
      cup.classList.remove('cup-shaking');
      tiro++;
      updDots();
      if(tiro===1){
        setStatus('😬 ¡NADA AÚN!', 'Agita más fuerte... ¡el dado está esperando!');
        document.getElementById('hint').textContent = '👆 TOCA PARA VOLVER A TIRAR';
      } else {
        setStatus('🔥 ¡CASI LO TIENES!', '¡Un último tiro para revelar tu premio!');
        document.getElementById('hint').textContent = '👆 TOCA PARA EL TIRO FINAL';
      }
      animating = false;
    },{once:true});

  } else {
    // Final: shake then lift, dice fly out
    cup.classList.add('cup-shaking');
    cup.addEventListener('animationend', ()=>{
      cup.classList.remove('cup-shaking');
      document.getElementById('hint').style.display = 'none';
      setStatus('🎲 ¡REVELANDO TU PREMIO!','');

      setTimeout(()=>{
        cup.classList.add('cup-lifting');
        cup.addEventListener('animationend', ()=>{
          cup.style.display = 'none';
          tiro++;
          updDots();
          flyDice();
        },{once:true});
      }, 200);
    },{once:true});
  }
}

function flyDice(){
  const prize = PRIZES[Math.floor(Math.random()*PRIZES.length)];
  const winPos = Math.floor(Math.random()*5);

  for(let i=0;i<5;i++){
    const el = document.getElementById('die'+i);
    if(i===winPos){
      el.src = prize.img;
      el.classList.add('winner');
    } else {
      el.src = IMGS.dado_vaygo;
    }
    setTimeout(()=>{
      el.classList.add('fly'+i);
    }, i*60);
  }

  setStatus('🎉 ¡MIRA TU DADO DORADO!','El dado brillante es tu premio');

  setTimeout(()=>{
    showPrize(prize);
    gameOver = true;
    animating = false;
  }, 2000);
}

function setStatus(t,s){
  document.getElementById('stTitle').textContent = t;
  document.getElementById('stSub').textContent = s;
}

function showPrize(prize){
  document.getElementById('prizeDieImg').src = prize.img;
  document.getElementById('pval').textContent = prize.label;
  document.getElementById('pval').style.color = prize.color;
  document.getElementById('pdesc').textContent = prize.desc;
  document.getElementById('prizeModal').classList.add('show');
  confetti();
}

function closePrize(){
  document.getElementById('prizeModal').classList.remove('show');
}

function confetti(){
  const cols=['#C9A84C','#00CFFF','#FF2D9B','#33DD33','#3A7FFF','#fff'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.left=Math.random()*100+'vw';
    el.style.top='-10px';
    el.style.background=cols[Math.floor(Math.random()*cols.length)];
    el.style.animationDuration=(1.8+Math.random()*2.5)+'s';
    el.style.animationDelay=Math.random()+'s';
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

updDots();
</script>
