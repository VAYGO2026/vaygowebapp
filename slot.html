<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>VAYGO — Slot Machine</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'DM Sans',sans-serif;}
.app{width:100%;max-width:430px;height:100dvh;margin:0 auto;position:relative;display:flex;flex-direction:column;background:#000;}

.machine-wrap{
  flex:1;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
}
.machine-bg{
  position:absolute;inset:0;
  background:url('./machine.png') center center / contain no-repeat;
  background-color:#000;
  z-index:0;
}

/* REELS — overlaid on the white drums */
.reels-overlay{
  position:absolute;
  top:33%;left:50%;
  transform:translateX(-50%);
  width:58%;max-width:220px;
  height:26%;
  display:flex;gap:2%;
  z-index:10;
}

.reel{
  flex:1;overflow:hidden;position:relative;
  border-radius:4px;
  background:rgba(255,255,255,0.06);
}

.reel-inner{
  display:flex;flex-direction:column;
  will-change:transform;
}

.reel-item{
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-family:'DM Sans',sans-serif;
  letter-spacing:0px;
  line-height:1.1;
  text-align:center;
  padding:0 2px;
  white-space:pre;
}

/* SPIN BUTTON */
.spin-btn-wrap{
  position:absolute;
  top:60%;left:50%;
  transform:translateX(-50%);
  z-index:20;width:28%;max-width:105px;
}
.spin-btn{
  width:100%;
  background:linear-gradient(180deg,#ff5555 0%,#cc0000 50%,#880000 100%);
  border:none;border-radius:8px;
  padding:8px 0;
  color:#fff;font-family:'Anton',sans-serif;
  font-size:clamp(13px,3.5vw,18px);letter-spacing:2px;
  cursor:pointer;
  box-shadow:0 4px 0 #550000,0 6px 18px rgba(255,0,0,0.45),inset 0 1px 0 rgba(255,255,255,0.25);
  transition:transform 0.1s,box-shadow 0.1s;
}
.spin-btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 #550000;}
.spin-btn:disabled{opacity:0.45;cursor:not-allowed;}

/* BACK */
.back-btn{
  position:absolute;top:12px;left:12px;z-index:30;
  width:34px;height:34px;border-radius:50%;
  background:rgba(0,0,0,0.55);border:1px solid rgba(255,255,255,0.2);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:20px;text-decoration:none;
  backdrop-filter:blur(6px);
}

/* WIN FLASH */
@keyframes winFlash{0%,100%{opacity:1;}50%{opacity:0.4;}}
.reel.win{ animation:winFlash 0.3s ease 3; }

/* QR MODAL */
#qrModal{
  position:fixed;inset:0;z-index:300;
  display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.97);padding:16px;overflow-y:auto;
}
#qrModal.show{display:flex;animation:fadeIn 0.35s ease;}
@keyframes fadeIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
.qr-box{
  background:#0a0a1a;border-radius:24px;padding:24px 20px;
  text-align:center;width:100%;max-width:320px;
  border:2px solid #C9A84C;box-shadow:0 0 60px rgba(201,168,76,0.3);
}
.qr-your-prize{font-size:10px;color:#00CFFF;text-transform:uppercase;letter-spacing:3px;margin-bottom:8px;}
.qr-prize-val{font-family:'Anton',sans-serif;font-size:64px;line-height:1;color:#fff;margin-bottom:4px;}
.qr-rest-name{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:14px;}
.qr-code-pill{background:#111;border-radius:10px;padding:8px 18px;font-family:monospace;font-size:17px;font-weight:700;color:#fff;letter-spacing:2px;margin-bottom:6px;display:inline-block;}
.qr-valid-txt{font-size:12px;color:#f59e0b;font-weight:700;margin-bottom:14px;}
#qr-canvas{display:flex;justify-content:center;margin:0 auto 10px;width:264px;height:264px;}
#qr-canvas img{border-radius:8px;}
.qr-hint{font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:14px;}
.qr-min-box{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:10px;padding:10px;font-size:11px;color:rgba(255,255,255,0.6);}
.qr-min-box strong{color:#f59e0b;}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyAnfS-H1Ci1WaAnjoBTA9IJFYSklAk-okM",
  authDomain:"vaygo-app.firebaseapp.com",
  projectId:"vaygo-app",
  storageBucket:"vaygo-app.firebasestorage.app",
  appId:"vaygo-app"
});
const db = firebase.firestore();

const REST_ID      = "lobster";
const REST_NAME    = "Lobster House";
const CLOSE_HOUR   = 23;
const CLOSE_MIN    = 59;
const MIN_PURCHASE = "$20 USD";

const PRIZES = [
  { label:"10% OFF", color:"#00CFFF" },
  { label:"15% OFF", color:"#FF2D9B" },
  { label:"20% OFF", color:"#FFD700" }
];

function genCode(){
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const seg=n=>Array.from({length:n},()=>chars[Math.floor(Math.random()*chars.length)]).join('');
  return 'VYG-'+seg(4)+'-'+seg(4);
}
function getExpiry(){
  const now=new Date(),exp=new Date(now);
  exp.setHours(CLOSE_HOUR,CLOSE_MIN,59,0);
  if(exp<=now) exp.setDate(exp.getDate()+1);
  return exp;
}
async function saveAndShowQR(prize){
  const today=new Date().toISOString().slice(0,10);
  const spinKey=REST_ID+'_slot_'+today;
  try{
    const ex=localStorage.getItem('vaygo_slot_'+REST_ID);
    if(ex){const d=JSON.parse(ex);if(d.spinKey===spinKey){displayQRModal(d.code,prize.label,d.expires);return;}}
  }catch(e){}
  const code=genCode(),expires=getExpiry();
  const data={code,prize:prize.label,restId:REST_ID,restName:REST_NAME,spinKey,
    spunAt:firebase.firestore.FieldValue.serverTimestamp(),
    expiresAt:expires.toISOString(),used:false,uid:'anonymous_'+Date.now(),game:'slot'};
  try{await db.collection('codes').doc(code).set(data);}catch(e){console.error(e);}
  try{localStorage.setItem('vaygo_slot_'+REST_ID,JSON.stringify({code,spinKey,expires:expires.toISOString(),prize:prize.label}));}catch(e){}
  displayQRModal(code,prize.label,expires.toISOString());
}
function displayQRModal(code,prize,expiresISO){
  const t=new Date(expiresISO).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('qr-prize').textContent=prize;
  document.getElementById('qr-rest').textContent=REST_NAME;
  document.getElementById('qr-code-txt').textContent=code;
  document.getElementById('qr-valid').textContent='Valid until: '+t+' today';
  document.getElementById('qr-min').innerHTML='Valid on orders of <strong>'+MIN_PURCHASE+'</strong> or more';
  const qrDiv=document.getElementById('qr-canvas');
  qrDiv.innerHTML='';
  new QRCode(qrDiv,{text:code,width:240,height:240,colorDark:'#000',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M});
  setTimeout(()=>{const img=qrDiv.querySelector('img');if(img){img.style.padding='12px';img.style.background='#fff';img.style.borderRadius='12px';img.style.display='block';}},100);
  document.getElementById('qrModal').classList.add('show');
}
</script>
</head>
<body>
<div class="app">
  <a href="lobster.html" class="back-btn">‹</a>

  <div class="machine-wrap">
    <div class="machine-bg"></div>

    <!-- 3 REELS over the drums -->
    <div class="reels-overlay" id="reelsOverlay">
      <div class="reel" id="reel0"><div class="reel-inner" id="inner0"></div></div>
      <div class="reel" id="reel1"><div class="reel-inner" id="inner1"></div></div>
      <div class="reel" id="reel2"><div class="reel-inner" id="inner2"></div></div>
    </div>

    <!-- SPIN BUTTON -->
    <div class="spin-btn-wrap">
      <button class="spin-btn" id="spinBtn" onclick="spin()">SPIN</button>
    </div>
  </div>

  <div id="qrModal">
    <div class="qr-box">
      <div class="qr-your-prize">🎉 YOUR PRIZE</div>
      <div class="qr-prize-val" id="qr-prize">20% OFF</div>
      <div class="qr-rest-name" id="qr-rest">Lobster House</div>
      <div class="qr-code-pill" id="qr-code-txt">VYG-XXXX-XXXX</div>
      <div class="qr-valid-txt" id="qr-valid">Valid until: 11:59 pm today</div>
      <div id="qr-canvas"></div>
      <div class="qr-hint">Show this QR to the staff to redeem your prize</div>
      <div class="qr-min-box">⚠️ MINIMUM PURCHASE REQUIRED<br><span id="qr-min">Valid on orders of <strong>$20 USD</strong> or more</span></div>
    </div>
  </div>
</div>

<script>
let spinning = false;
let done = false;

// Only prizes on reels — repeat for scroll variety
const REEL_ITEMS = [
  { label:"10%\nOFF", color:"#00CFFF" },
  { label:"15%\nOFF", color:"#FF2D9B" },
  { label:"20%\nOFF", color:"#FFD700" },
  { label:"10%\nOFF", color:"#00CFFF" },
  { label:"15%\nOFF", color:"#FF2D9B" },
  { label:"20%\nOFF", color:"#FFD700" },
  { label:"10%\nOFF", color:"#00CFFF" },
  { label:"15%\nOFF", color:"#FF2D9B" },
  { label:"20%\nOFF", color:"#FFD700" },
];

function buildReels(){
  const h = document.getElementById('reelsOverlay').clientHeight;
  const fs = Math.max(6, h * 0.10); // font size — 10% of reel height

  for(let r = 0; r < 3; r++){
    const inner = document.getElementById('inner' + r);
    inner.innerHTML = '';
    // Build 4 full loops for smooth spinning
    const items = [...REEL_ITEMS,...REEL_ITEMS,...REEL_ITEMS,...REEL_ITEMS];
    items.forEach(item => {
      const div = document.createElement('div');
      div.className = 'reel-item';
      div.style.height = h + 'px';
      div.style.fontSize = fs + 'px';
      div.style.color = item.color;
      div.style.textShadow = `0 0 14px ${item.color}, 0 2px 6px rgba(0,0,0,0.9)`;
      div.style.fontWeight = '700';
      div.style.fontFamily = "'DM Sans', sans-serif";
      div.style.whiteSpace = 'pre';
      div.style.display = 'flex';
      div.style.alignItems = 'center';
      div.style.justifyContent = 'center';
      div.textContent = item.label;
      inner.appendChild(div);
    });
    // Start position at second loop
    inner.style.transition = 'none';
    inner.style.transform = `translateY(-${REEL_ITEMS.length * h}px)`;
  }
}

window.addEventListener('load', buildReels);
window.addEventListener('resize', buildReels);

// ── SOUND ──
let _ac = null;
function getAC(){
  if(!_ac) _ac = new(window.AudioContext||window.webkitAudioContext)();
  if(_ac.state==='suspended') _ac.resume();
  return _ac;
}
function makeNoise(ac,dur){
  const buf=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate);
  const d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
  return buf;
}
function playSpinSound(){
  try{
    const ac=getAC(),now=ac.currentTime;
    for(let i=0;i<20;i++){
      const t=i*0.055;
      const b=makeNoise(ac,0.04),s=ac.createBufferSource();s.buffer=b;
      const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=1200+Math.random()*500;f.Q.value=4;
      const g=ac.createGain();
      g.gain.setValueAtTime(0.35,now+t);
      g.gain.exponentialRampToValueAtTime(0.001,now+t+0.038);
      s.connect(f);f.connect(g);g.connect(ac.destination);
      s.start(now+t);s.stop(now+t+0.05);
    }
  }catch(e){}
}
function playStopSound(){
  try{
    const ac=getAC(),now=ac.currentTime;
    const b=makeNoise(ac,0.08),s=ac.createBufferSource();s.buffer=b;
    const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=3;
    const g=ac.createGain();
    g.gain.setValueAtTime(0.45,now);
    g.gain.exponentialRampToValueAtTime(0.001,now+0.07);
    s.connect(f);f.connect(g);g.connect(ac.destination);
    s.start(now);s.stop(now+0.09);
  }catch(e){}
}
function playWinSound(){
  try{
    const ac=getAC(),now=ac.currentTime;
    [[0,523],[0.13,659],[0.26,784],[0.39,1047],[0.52,1319]].forEach(([t,f])=>{
      const o=ac.createOscillator();o.type='sine';
      const g=ac.createGain();o.frequency.value=f;
      g.gain.setValueAtTime(0,now+t);
      g.gain.linearRampToValueAtTime(0.28,now+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,now+t+0.28);
      o.connect(g);g.connect(ac.destination);
      o.start(now+t);o.stop(now+t+0.3);
    });
  }catch(e){}
}

// ── SPIN ──
function spin(){
  if(spinning || done) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;
  playSpinSound();

  // Pick ONE prize — same for all 3 reels
  const prize = PRIZES[Math.floor(Math.random() * PRIZES.length)];

  // Find which index in REEL_ITEMS matches the prize
  const shortLabel = prize.label.replace(' ', '\n'); // "10%\nOFF"
  const prizePercent = prize.label.split('%')[0] + '%'; // "10%"

  // Find landing index in 3rd batch (index 18-26)
  const h = document.getElementById('reelsOverlay').clientHeight;
  const totalItems = REEL_ITEMS.length; // 9
  let landIdx = totalItems * 2; // start of 3rd batch
  for(let i = totalItems*2; i < totalItems*3; i++){
    if(REEL_ITEMS[i % totalItems].label.startsWith(prizePercent)){
      landIdx = i;
      break;
    }
  }

  // Spin each reel, stop on same symbol staggered
  [0,1,2].forEach((r, idx) => {
    const inner = document.getElementById('inner' + r);
    const spinDur = 1000 + idx * 350;
    const targetY = -(landIdx * h);

    inner.style.transition = `transform ${spinDur}ms cubic-bezier(0.25,0.46,0.10,1.0)`;
    inner.style.transform = `translateY(${targetY}px)`;

    setTimeout(() => {
      playStopSound();
      document.getElementById('reel'+r).classList.add('win');

      if(idx === 2){
        // All reels stopped
        setTimeout(() => {
          spinning = false;
          done = true;
          playWinSound();
          confetti();
          setTimeout(() => saveAndShowQR(prize), 900);
        }, 300);
      }
    }, spinDur);
  });
}

// ── CONFETTI ──
function confetti(){
  const canvas=document.createElement('canvas');
  canvas.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
  document.body.appendChild(canvas);
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const ctx=canvas.getContext('2d');
  const COLS=['#C9A84C','#FF2D9B','#00CFFF','#33DD33','#FFD700','#ffffff'];
  const pieces=Array.from({length:120},()=>({
    x:Math.random()*canvas.width,y:-20-Math.random()*100,
    vx:(Math.random()-0.5)*3,vy:2+Math.random()*4,
    color:COLS[Math.floor(Math.random()*COLS.length)],
    angle:Math.random()*Math.PI*2,spin:(Math.random()-0.5)*0.15,
    wave:Math.random()*Math.PI*2,waveSpd:0.05+Math.random()*0.07,
    w:4+Math.random()*5,h:8+Math.random()*12,alpha:1,dead:false
  }));
  let frame=0;
  function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    pieces.forEach(p=>{
      if(p.dead)return;
      p.wave+=p.waveSpd;p.x+=p.vx+Math.sin(p.wave)*1.2;p.y+=p.vy;p.angle+=p.spin;p.vy+=0.06;
      if(p.y>canvas.height*0.82)p.alpha-=0.025;
      if(p.alpha<=0){p.dead=true;return;}
      alive=true;
      ctx.save();ctx.globalAlpha=p.alpha;ctx.translate(p.x,p.y);ctx.rotate(p.angle);
      ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=5;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    frame++;
    if(alive&&frame<300) requestAnimationFrame(loop);
    else canvas.remove();
  }
  loop();
}
</script>
</body>
</html>
