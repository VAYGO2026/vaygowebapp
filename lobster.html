/* Overlay */
.overlay{
  position:absolute;inset:0;
  background:linear-gradient(to bottom,
    rgba(0,0,0,0.0) 0%,
    rgba(0,0,0,0.0) 35%,
    rgba(0,0,0,0.6) 60%,
    rgba(0,0,0,0.85) 100%
  );
  z-index:1;
}

/* PHOTO BANNER — 3 fotos en la parte superior */
.photo-banner{
  position:absolute;
  top:0;left:0;right:0;
  height:240px;
  z-index:5;
  display:flex;
  flex-direction:row;
  gap:0;
}
.photo-banner img{
  flex:1;
  width:33.33%;
  height:100%;
  object-fit:cover;
  display:block;
}
.photo-banner img:first-child{border-radius:32px 0 0 0;}
.photo-banner img:last-child{border-radius:0 32px 0 0;}

/* Gradiente sobre las fotos para suavizar la transición */
.photo-fade{
  position:absolute;
  top:190px;left:0;right:0;
  height:80px;
  background:linear-gradient(to bottom, transparent, rgba(0,0,0,0.5));
  z-index:6;
  pointer-events:none;
}

/* CONTENIDO */
.content{
  position:absolute;
  top:250px;
  left:0;right:0;bottom:0;
  z-index:10;
  padding:0 24px 80px;
  overflow-y:auto;
  scrollbar-width:none;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.content::-webkit-scrollbar{display:none;}

/* Nombre restaurante */
.rest-name{
  font-family:'Anton',sans-serif;
  font-size:28px;
  color:#fff;
  letter-spacing:2px;
  text-shadow:0 2px 12px rgba(0,0,0,0.9);
  line-height:1.1;
}
.rest-type{
  font-family:'DM Sans',sans-serif;
  font-size:13px;
  font-weight:300;
  color:rgba(255,255,255,0.75);
  letter-spacing:0.15em;
  text-transform:uppercase;
  margin-top:4px;
}

/* Rating y precio */
.rest-meta{
  display:flex;
  gap:14px;
  align-items:center;
}
.rest-rating{
  font-size:18px;
  font-weight:800;
  color:#FFD700;
}
.rest-price{
  font-size:13px;
  color:rgba(255,255,255,0.7);
  font-weight:600;
}
.rest-since{
  font-size:11px;
  color:rgba(255,255,255,0.5);
  font-style:italic;
}

/* Divider */
.divider{
  height:1px;
  background:rgba(255,255,255,0.15);
}

/* Info cards */
.info-row{
  display:flex;
  gap:10px;
}
.info-card{
  flex:1;
  background:rgba(255,255,255,0.08);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,0.15);
  border-radius:14px;
  padding:12px 14px;
  display:flex;
  flex-direction:column;
  gap:3px;
}
.info-label{
  font-size:9px;
  font-weight:800;
  color:rgba(255,255,255,0.45);
  letter-spacing:0.15em;
  text-transform:uppercase;
}
.info-value{
  font-size:13px;
  font-weight:600;
  color:#fff;
}

/* Descripción */
.rest-desc{
  font-size:13px;
  color:rgba(255,255,255,0.75);
  line-height:1.7;
}

/* Botón CLAIM BENEFIT */
.claim-btn{
  width:100%;
  background:linear-gradient(90deg,#C9A84C,#FFD700,#C9A84C);
  background-size:200%;
  border:none;
  border-radius:50px;
  padding:16px;
  color:#000;
  font-family:'Anton',sans-serif;
  font-size:16px;
  letter-spacing:2px;
  cursor:pointer;
  animation:goldShine 2.5s linear infinite;
}
@keyframes goldShine{
  0%{background-position:0%;}
  100%{background-position:200%;}
}
</style>
