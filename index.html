<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="apple-touch-icon" href="./vaygo-icon.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="VAYGO"/>
<meta name="theme-color" content="#060E1C"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>VAYGO — Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;
  background:#060E1C;
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Sans',sans-serif;
}

.app{
  width:390px;
  height:100dvh;
  max-height:844px;
  border-radius:32px;
  overflow:hidden;
  position:relative;
  background: url("fondo-inicio.webp") center top / cover no-repeat;
}

.app::after{
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;
  height:55%;
  background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.35) 100%);
  pointer-events:none;
  z-index:0;
}

/* ── WHERE LABEL ── */
.where-label{
  font-family:'DM Sans',sans-serif;
  font-size:16px;
  font-weight:700;
  letter-spacing:0.10em;
  text-transform:uppercase;
  color:#ffffff;
  text-shadow: 0 1px 10px rgba(0,0,0,0.8);
  margin-bottom:12px;
  text-align:center;
}

/* ── CITIES wrapper ── */
.cities{
  position:absolute;
  top:48%;
  left:0; right:0;
  z-index:10;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:11px;
  padding: 0 48px;
}

/* ── @property for neon rotation ── */
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

@keyframes rotateBorder {
  from { --angle: 0deg; }
  to   { --angle: 360deg; }
}

/* ── Base city button ── */
.city-btn {
  width: 100%;
  position: relative;
  border: none;
  border-radius: 16px;
  padding: 14px 18px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  font-size: 15px;
  font-weight: 800;
  color: #0a1a00;
  text-align: center;
  letter-spacing: 0.08em;
  transition: transform 0.13s, box-shadow 0.13s;
  text-shadow: none;
  background: linear-gradient(180deg, #d4f56a 0%, #8fc20a 50%, #5a8000 100%);
  box-shadow: 0 4px 0 #2d4000, 0 6px 20px rgba(212,245,106,0.3), inset 0 1px 0 rgba(255,255,255,0.3);
  isolation: isolate;
  overflow: hidden;
}

/* Shimmer */
.city-btn::after {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 60%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
  transform: skewX(-20deg);
  animation: shimmer 3s infinite;
  z-index: 2;
}
@keyframes shimmer { 0%{left:-100%} 100%{left:200%} }

/* Neon ring — sits behind button */
.city-btn::before {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 18px;
  z-index: -1;
  padding: 2px;
  background: conic-gradient(
    from var(--angle),
    transparent 0deg,
    transparent 55deg,
    rgba(180,220,80,0.6) 85deg,
    rgba(220,255,100,1.0) 120deg,
    rgba(180,220,80,0.6) 155deg,
    transparent 185deg,
    transparent 360deg
  );
  -webkit-mask:
    linear-gradient(#fff 0 0) content-box,
    linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: rotateBorder 1.8s linear infinite;
}

/* Stagger per button */
.city-btn:nth-child(2)::before { animation-delay: 0s; }
.city-btn:nth-child(3)::before { animation-delay: 0.75s; }
.city-btn:nth-child(4)::before { animation-delay: 1.5s; }
.city-btn:nth-child(5)::before { animation-delay: 2.25s; }
.city-btn:nth-child(6)::before { animation-delay: 3s; }

.city-btn:active { transform: translateY(3px); box-shadow: 0 0 0 #2d4000, 0 2px 8px rgba(212,245,106,0.15); }

/* Coming soon — dimmer */
.city-btn.coming {
  cursor: default;
  background: linear-gradient(180deg, rgba(212,245,106,0.3) 0%, rgba(143,194,10,0.22) 50%, rgba(90,128,0,0.18) 100%);
  color: rgba(255,255,255,0.7);
  box-shadow: 0 4px 0 rgba(45,64,0,0.25), inset 0 1px 0 rgba(255,255,255,0.1);
}
.city-btn.coming::after { display: none; }
.city-btn.coming:active { transform: none; }

.next-tag{
  font-size:10px;
  font-weight:800;
  color:#FFD700;
  letter-spacing:0.14em;
  margin-left:6px;
  vertical-align:middle;
  text-shadow: 0 0 8px rgba(255,215,0,0.8);
}

/* Responsive */
@media(max-width:430px){
  .app{ width:100%; border-radius:0; }
}
</style>
</head>
<body>
<div class="app">

  <div class="cities">
    <div class="where-label">Where are you?</div>
    <button class="city-btn" onclick="location.href='app.html?city=cozumel'">Cozumel</button>
    <button class="city-btn coming" disabled>Playa del Carmen <span class="next-tag">NEXT</span></button>
    <button class="city-btn coming" disabled>Tulum <span class="next-tag">NEXT</span></button>
    <button class="city-btn coming" disabled>Bacalar <span class="next-tag">NEXT</span></button>
    <button class="city-btn coming" disabled>Cancún <span class="next-tag">NEXT</span></button>
  </div>

</div>



<script src="admin-float.js"></script>
</body>
</html>
