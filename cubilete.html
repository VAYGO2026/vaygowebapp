<title>VAYGO — Dice Challenge</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:'DM Sans',sans-serif;}
.app{width:100%;max-width:430px;height:100dvh;margin:0 auto;position:relative;display:flex;flex-direction:column;background:url('./fondo-cubilete.webp') center center / cover no-repeat;}

/* HEADER */
.hdr{height:54px;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;z-index:20;border-bottom:1px solid rgba(201,168,76,0.15);}
.back{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;text-decoration:none;}
.logo-n{font-family:'Anton',sans-serif;font-size:18px;color:#C9A84C;letter-spacing:4px;text-align:center;}
.logo-s{font-size:7px;color:rgba(255,255,255,0.35);letter-spacing:2px;text-align:center;}
.rolls-box{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:4px 10px;text-align:center;}
.rolls-lbl{font-size:7px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;display:block;margin-bottom:3px;}
.rolls-dots{display:flex;gap:4px;justify-content:center;}
.rdot{width:12px;height:12px;border-radius:50%;background:#C9A84C;box-shadow:0 0 5px #C9A84C;transition:all 0.3s;}
.rdot.used{background:#222;box-shadow:none;}

/* STATUS */
.status{position:absolute;top:14px;left:0;right:0;text-align:center;z-index:10;pointer-events:none;}
.st-title{font-family:'Anton',sans-serif;font-size:26px;color:#fff;letter-spacing:2px;}
.st-sub{font-size:14px;color:rgba(255,255,255,0.4);margin-top:4px;letter-spacing:1px;}

/* Líneas de color bandera en los bordes */
.game .flag-left,
.game .flag-right{
  position:absolute;top:0;bottom:0;width:4px;z-index:1;pointer-events:none;
}
.game .flag-left{
  left:0;
  background:linear-gradient(to bottom, transparent, rgba(0,200,80,0.9) 30%, rgba(0,200,80,0.9) 70%, transparent);
  box-shadow: 2px 0 22px rgba(0,210,80,0.55), 4px 0 40px rgba(0,180,70,0.25);
}
.game .flag-right{
  right:0;
  background:linear-gradient(to bottom, transparent, rgba(220,10,40,0.9) 30%, rgba(220,10,40,0.9) 70%, transparent);
  box-shadow: none; opacity:0;
}

/* CUP */
#cup{
  position:absolute;
  left:50%;top:10%;
  transform:translateX(-50%);
  width:88%;max-width:340px;
  z-index:8;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
  -webkit-user-select:none;
}
#cupImg{width:100%;display:block;}

/* HINT */
#hint{
  position:absolute;bottom:18px;left:0;right:0;
  text-align:center;z-index:10;
  font-size:11px;color:rgba(0,207,255,0.8);
  letter-spacing:2px;text-transform:uppercase;
  animation:blink 1.5s infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* CUP shake */
@keyframes cupShake{
  0%  {transform:translateX(-50%) rotate(0deg) translateY(0);}
  12% {transform:translateX(calc(-50% - 20px)) rotate(-11deg) translateY(-10px);}
  25% {transform:translateX(calc(-50% + 20px)) rotate(11deg) translateY(-14px);}
  37% {transform:translateX(calc(-50% - 15px)) rotate(-8deg) translateY(-8px);}
  50% {transform:translateX(calc(-50% + 15px)) rotate(8deg) translateY(-12px);}
  62% {transform:translateX(calc(-50% - 8px)) rotate(-4deg) translateY(-5px);}
  75% {transform:translateX(calc(-50% + 8px)) rotate(4deg) translateY(-8px);}
  100%{transform:translateX(-50%) rotate(0deg) translateY(0);}
}
.shaking{animation:cupShake 0.65s ease-in-out;}

/* DICE */
.die{
  position:absolute;
  width:105px;height:105px;
  object-fit:contain;
  z-index:5;opacity:0;
  pointer-events:none;
}
.die.prize-die{width:140px;height:140px;z-index:15;}

@keyframes fly0{0%{opacity:0;transform:translate(0,0) scale(0.2) rotate(0);}20%{opacity:1;}100%{opacity:1;transform:translate(-120px,80px) scale(1) rotate(-30deg);}}
@keyframes fly1{0%{opacity:0;transform:translate(0,0) scale(0.2) rotate(0);}20%{opacity:1;}100%{opacity:1;transform:translate(-50px,100px) scale(1) rotate(18deg);}}
@keyframes fly2{0%{opacity:0;transform:translate(0,0) scale(0.2) rotate(0);}20%{opacity:1;}100%{opacity:1;transform:translate(0px,110px) scale(1) rotate(-8deg);}}
@keyframes fly3{0%{opacity:0;transform:translate(0,0) scale(0.2) rotate(0);}20%{opacity:1;}100%{opacity:1;transform:translate(50px,100px) scale(1) rotate(22deg);}}
@keyframes fly4{0%{opacity:0;transform:translate(0,0) scale(0.2) rotate(0);}20%{opacity:1;}100%{opacity:1;transform:translate(120px,80px) scale(1) rotate(-28deg);}}

.fly0{animation:fly0 0.7s cubic-bezier(0.2,0.8,0.3,1) forwards;}
.fly1{animation:fly1 0.7s cubic-bezier(0.2,0.8,0.3,1) forwards;animation-delay:0.07s;}
.fly2{animation:fly2 0.7s cubic-bezier(0.2,0.8,0.3,1) forwards;animation-delay:0.14s;}
.fly3{animation:fly3 0.7s cubic-bezier(0.2,0.8,0.3,1) forwards;animation-delay:0.21s;}
.fly4{animation:fly4 0.7s cubic-bezier(0.2,0.8,0.3,1) forwards;animation-delay:0.28s;}

/* NAV */
.nav{height:54px;background:rgba(0,0,0,0.98);border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-around;flex-shrink:0;z-index:20;}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.ni .ico{font-size:15px;}
.ni span{font-size:7px;color:rgba(255,255,255,0.3);}
.nc{background:linear-gradient(180deg,#C9A84C,#8B6914);border-radius:50%;width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:-12px;box-shadow:0 0 0 3px #000,0 0 0 4px rgba(201,168,76,0.3);}
.nc .ico{font-size:14px;}
.nc .lbl{font-size:7px;color:#fff;font-weight:700;}

/* PRIZE MODAL */
#prizeModal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.93);}
#prizeModal.show{display:flex;animation:fadeIn 0.35s ease;}
@keyframes fadeIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
.pbox{background:#050005;border-radius:24px;padding:30px 24px;text-align:center;width:300px;border:2px solid #C9A84C;box-shadow:0 0 60px rgba(201,168,76,0.25);}
.pwin-lbl{font-size:10px;color:#00CFFF;text-transform:uppercase;letter-spacing:3px;margin-bottom:14px;}
.prize-img-wrap{width:130px;height:130px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
.prize-img-wrap img{width:100%;animation:prizePulse 1.5s infinite;}
@keyframes prizePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.pval{font-family:'Anton',sans-serif;font-size:56px;line-height:1;margin-bottom:6px;}
.pdesc{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:22px;}
.pbtn{background:linear-gradient(180deg,#C9A84C,#8B6914);border:none;border-radius:50px;padding:14px 0;color:#fff;font-family:'Anton',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;width:100%;box-shadow:0 4px 0 #5A4008;}

#serpCanvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:199;}
</style>

const NORMAL_DICE = [IMGS.dado_b1, IMGS.dado_b2, IMGS.dado_b3, IMGS.dado_b4, IMGS.dado_b5];
const PRIZES = [
  {img:IMGS.dado_10, label:'10% OFF', desc:'10% off your total bill', color:'#FF2D9B'},
  {img:IMGS.dado_15, label:'15% OFF', desc:'15% off your total bill', color:'#33DD33'},
  {img:IMGS.dado_20, label:'20% OFF', desc:'20% off your total bill', color:'#3A7FFF'},
];

document.getElementById('cupImg').src = IMGS.cubilete;

function positionDice(){
  const game = document.getElementById('game');
  const cup  = document.getElementById('cup');
  const gw   = game.clientWidth;
  const cupBottom = cup.offsetTop + cup.offsetHeight - 60;
  for(let i=0;i<5;i++){
    const el = document.getElementById('die'+i);
    el.style.left = (gw/2 - 42) + 'px';
    el.style.top  = cupBottom + 'px';
  }
}
window.addEventListener('load', positionDice);
window.addEventListener('resize', positionDice);
setTimeout(positionDice, 300);

let tiro=0, animating=false, gameOver=false;
let lastShake=0, shakeCount=0;

if(window.DeviceMotionEvent){
  window.addEventListener('devicemotion', e=>{
    const a = e.accelerationIncludingGravity;
    if(!a) return;
    const mag = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
    const now = Date.now();
    if(mag > 18 && now - lastShake > 350){
      lastShake = now; shakeCount++;
      if(shakeCount >= 2){ shakeCount=0; handleTap(); }
    }
  });
}
if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
  document.getElementById('game').addEventListener('click', ()=>{
    DeviceMotionEvent.requestPermission().catch(()=>{});
  },{once:true});
}

function updDots(){
  [0,1,2].forEach(i=> document.getElementById('d'+i).classList.toggle('used', i>=(3-tiro)));
}

function handleTap(){
  if(animating||gameOver) return;
  animating=true;
  const cup = document.getElementById('cup');

  if(tiro===0){
    shakeCup(()=>{
      tiro++; updDots();
      setStatus('😬 NOT YET!', 'Shake harder... the dice are waiting!');
      document.getElementById('hint').textContent='👆 TAP TO ROLL AGAIN';
      animating=false;
    });
  } else if(tiro===1){
    shakeCup(()=>{
      tiro++; updDots();
      setStatus('🔥 SO CLOSE!', 'One last roll to reveal your prize!');
      document.getElementById('hint').textContent='👆 TAP FOR THE FINAL ROLL';
      flyNormalDice();
      animating=false;
    });
  } else {
    shakeCup(()=>{
      tiro++; updDots();
      document.getElementById('hint').style.display='none';
      setStatus('🎲 REVEALING YOUR PRIZE!','');
      resetDice(()=>{ flyAllWithPrize(); });
    });
  }
}

/* ══ SONIDOS — Web Audio API ══ */
let _ac = null;
function getAC(){
  if(!_ac) _ac = new (window.AudioContext||window.webkitAudioContext)();
  if(_ac.state === 'suspended') _ac.resume();
  return _ac;
}

/* Genera ruido blanco filtrado — base de todos los sonidos */
function makeNoise(ac, durationSec){
  const sr  = ac.sampleRate;
  const len = Math.ceil(sr * durationSec);
  const buf = ac.createBuffer(1, len, sr);
  const d   = buf.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
  return buf;
}

/* ── 1. SHAKE: golpes de dados dentro del cubilete ── */
function playShakeSound(){
  try{
    const ac  = getAC();
    const now = ac.currentTime;
    // 8 impactos rítmicos de dados contra cuero
    const times = [0, 0.06, 0.13, 0.21, 0.29, 0.38, 0.47, 0.57];
    times.forEach(t => {
      const buf = makeNoise(ac, 0.12);
      const src = ac.createBufferSource(); src.buffer = buf;

      // Filtro resonante — da cuerpo de madera/hueso
      const bp = ac.createBiquadFilter();
      bp.type = 'bandpass'; bp.frequency.value = 1200 + Math.random()*600; bp.Q.value = 3;

      // Filtro de corte alto — quita el ruido artificial
      const lp = ac.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.value = 4000;

      const env = ac.createGain();
      const vol = 0.55 + Math.random()*0.25;
      env.gain.setValueAtTime(0,          now+t);
      env.gain.linearRampToValueAtTime(vol, now+t+0.003);
      env.gain.exponentialRampToValueAtTime(0.001, now+t+0.10);

      src.connect(bp); bp.connect(lp); lp.connect(env); env.connect(ac.destination);
      src.start(now+t); src.stop(now+t+0.13);
    });

    // Rodar suave de fondo (shake del cubilete)
    const rollBuf = makeNoise(ac, 0.65);
    const rollSrc = ac.createBufferSource(); rollSrc.buffer = rollBuf;
    const rollFlt = ac.createBiquadFilter(); rollFlt.type='lowpass'; rollFlt.frequency.value=600;
    const rollEnv = ac.createGain();
    rollEnv.gain.setValueAtTime(0.18, now);
    rollEnv.gain.setValueAtTime(0.22, now+0.2);
    rollEnv.gain.linearRampToValueAtTime(0, now+0.65);
    rollSrc.connect(rollFlt); rollFlt.connect(rollEnv); rollEnv.connect(ac.destination);
    rollSrc.start(now); rollSrc.stop(now+0.66);
  }catch(e){ console.warn('audio error',e); }
}

/* ── 2. DICE FLY: dados saliendo disparados ── */
function playDiceFlySound(){
  try{
    const ac  = getAC();
    const now = ac.currentTime;

    // Impacto inicial fuerte
    const hit = makeNoise(ac, 0.15);
    const hs  = ac.createBufferSource(); hs.buffer = hit;
    const hbp = ac.createBiquadFilter(); hbp.type='bandpass'; hbp.frequency.value=1800; hbp.Q.value=2;
    const hg  = ac.createGain();
    hg.gain.setValueAtTime(0.8, now);
    hg.gain.exponentialRampToValueAtTime(0.001, now+0.14);
    hs.connect(hbp); hbp.connect(hg); hg.connect(ac.destination);
    hs.start(now); hs.stop(now+0.16);

    // 4 clacks de dados saliendo uno a uno
    [0.05, 0.13, 0.21, 0.29].forEach(t => {
      const b = makeNoise(ac, 0.08);
      const s = ac.createBufferSource(); s.buffer = b;
      const f = ac.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1500+Math.random()*800; f.Q.value=4;
      const g = ac.createGain();
      g.gain.setValueAtTime(0.6, now+t);
      g.gain.exponentialRampToValueAtTime(0.001, now+t+0.07);
      s.connect(f); f.connect(g); g.connect(ac.destination);
      s.start(now+t); s.stop(now+t+0.09);
    });
  }catch(e){}
}

/* ── 3. CROWD CHEER: multitud festejando ── */
function playCrowdCheer(){
  try{
    const ac  = getAC();
    const now = ac.currentTime;
    const sr  = ac.sampleRate;
    const DUR = 3.5;

    /* Masa de voces — múltiples capas de ruido filtrado con LFO */
    [800, 1200, 1800, 2600].forEach((freq, i) => {
      const buf = ac.createBuffer(1, Math.ceil(sr*DUR), sr);
      const d   = buf.getChannelData(0);
      // Ruido con variación — simula diferentes voces
      for(let j=0;j<d.length;j++) d[j] = (Math.random()*2-1) * (0.5 + 0.5*Math.sin(j*0.002 + i));
      const src = ac.createBufferSource(); src.buffer = buf;

      const bp  = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=freq; bp.Q.value=1.5;

      // LFO para modulación tipo oleada de gritos
      const lfo = ac.createOscillator(); lfo.type='sine'; lfo.frequency.value = 4 + i*0.7;
      const lfoG= ac.createGain(); lfoG.gain.value = 0.12; lfo.connect(lfoG);

      const env = ac.createGain();
      env.gain.setValueAtTime(0,    now);
      env.gain.linearRampToValueAtTime(0.22, now+0.15);
      env.gain.setValueAtTime(0.22, now+DUR-0.6);
      env.gain.linearRampToValueAtTime(0,    now+DUR);
      lfoG.connect(env.gain);

      src.connect(bp); bp.connect(env); env.connect(ac.destination);
      lfo.start(now); lfo.stop(now+DUR);
      src.start(now); src.stop(now+DUR);
    });

    /* Chiflidos agudos — 3 silbidos expresivos */
    [[0.05, 2000, 0.30],[0.40, 2500, 0.28],[0.80, 3000, 0.26]].forEach(([t,f,v]) => {
      const osc = ac.createOscillator(); osc.type='sine';
      osc.frequency.setValueAtTime(f*0.9,  now+t);
      osc.frequency.linearRampToValueAtTime(f*1.25, now+t+0.10);
      osc.frequency.linearRampToValueAtTime(f*0.95, now+t+0.26);
      const g = ac.createGain();
      g.gain.setValueAtTime(0,   now+t);
      g.gain.linearRampToValueAtTime(v,    now+t+0.04);
      g.gain.exponentialRampToValueAtTime(0.001, now+t+0.32);
      osc.connect(g); g.connect(ac.destination);
      osc.start(now+t); osc.stop(now+t+0.35);
    });

    /* Aplausos — rafagas de ruido pulsado */
    for(let k=0;k<22;k++){
      const t  = 0.1 + k*0.12 + Math.random()*0.04;
      const b  = makeNoise(ac, 0.07);
      const s  = ac.createBufferSource(); s.buffer=b;
      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=5000;
      const g  = ac.createGain(); const v = 0.18+Math.random()*0.12;
      g.gain.setValueAtTime(v,     now+t);
      g.gain.exponentialRampToValueAtTime(0.001, now+t+0.06);
      s.connect(lp); lp.connect(g); g.connect(ac.destination);
      s.start(now+t); s.stop(now+t+0.08);
    }

    /* Fanfarria — Do-Mi-Sol-Do sube */
    [[1.2,523,0.22],[1.35,659,0.20],[1.50,784,0.20],[1.65,1047,0.24]].forEach(([t,f,v]) => {
      const o = ac.createOscillator(); o.type='square';
      const g = ac.createGain();
      g.gain.setValueAtTime(0,   now+t);
      g.gain.linearRampToValueAtTime(v,    now+t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001, now+t+0.22);
      // Filtro para suavizar el square
      const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=2000;
      o.frequency.value=f; o.connect(lp); lp.connect(g); g.connect(ac.destination);
      o.start(now+t); o.stop(now+t+0.25);
    });

  }catch(e){}
}

function shakeCup(cb){
  const cup = document.getElementById('cup');
  cup.classList.add('shaking');
  playShakeSound();
  cup.addEventListener('animationend', ()=>{
    cup.classList.remove('shaking');
    cb();
  },{once:true});
}

function resetDice(cb){
  for(let i=0;i<5;i++){
    const el=document.getElementById('die'+i);
    el.className='die';
    el.style.opacity='0';
  }
  positionDice();
  setTimeout(cb, 60);
}

function flyNormalDice(){
  const shuffled=[...NORMAL_DICE].sort(()=>Math.random()-0.5);
  playDiceFlySound();
  [0,1,3,4].forEach((pos,idx)=>{
    const el=document.getElementById('die'+pos);

    setTimeout(()=>{ el.classList.add('fly'+pos); }, idx*70);

}

  const prize=PRIZES[Math.floor(Math.random()*PRIZES.length)];
  const shuffled=[...NORMAL_DICE].sort(()=>Math.random()-0.5);

  // 4 normal dice
  playDiceFlySound();
  [0,1,3,4].forEach((pos,idx)=>{

  // Prize die center — bigger, front

}

/* ── SERPENTINAS ── */
let serpCanvas, serpCtx, serpPieces=[], serpRAF=null;

function confetti(){
  if(!serpCanvas){
    serpCanvas = document.createElement('canvas');
    serpCanvas.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;';
    document.body.appendChild(serpCanvas);
  }
  serpCanvas.width  = window.innerWidth;
  serpCanvas.height = window.innerHeight;
  serpCtx = serpCanvas.getContext('2d');

  const COLS = ['#C9A84C','#FF2D9B','#00CFFF','#33DD33','#FF8C00','#FF3333','#9B59FF','#ffffff','#FFD700'];
  serpPieces = [];

  for(let i=0;i<100;i++){
    const isTape = Math.random() > 0.35;
    serpPieces.push({
      x:       Math.random() * serpCanvas.width,
      y:       -10 - Math.random() * 120,
      vx:      (Math.random()-0.5) * 3,
      vy:      2 + Math.random() * 4,
      color:   COLS[Math.floor(Math.random()*COLS.length)],
      angle:   Math.random() * Math.PI * 2,
      spin:    (Math.random()-0.5) * 0.15,
      wave:    Math.random() * Math.PI * 2,
      waveSpd: 0.05 + Math.random() * 0.07,
      len:     isTape ? 30 + Math.random()*45 : 0,
      width:   isTape ? 3 + Math.random()*4   : 5 + Math.random()*6,
      alpha:   1,
      isTape,
      dead:    false,
    });
  }

  if(serpRAF) cancelAnimationFrame(serpRAF);
  let frame = 0;

  function loop(){
    serpCtx.clearRect(0, 0, serpCanvas.width, serpCanvas.height);
    let anyAlive = false;

    for(const p of serpPieces){
      if(p.dead) continue;

      // Física
      p.wave  += p.waveSpd;
      p.x     += p.vx + Math.sin(p.wave) * 1.5;
      p.y     += p.vy;
      p.angle += p.spin;
      p.vy    += 0.05;

      if(p.y > serpCanvas.height * 0.8) p.alpha -= 0.02;
      if(p.alpha <= 0){ p.dead = true; continue; }

      anyAlive = true;

      serpCtx.save();
      serpCtx.globalAlpha = p.alpha;
      serpCtx.translate(p.x, p.y);
      serpCtx.rotate(p.angle);

      if(p.isTape){
        // Serpentina ondulada
        serpCtx.beginPath();
        const segs = 10;
        serpCtx.moveTo(0, -p.len/2);
        for(let s=1; s<=segs; s++){
          const t  = s / segs;
          const ox = Math.sin(t * Math.PI * 3 + p.wave) * p.width * 1.8;
          serpCtx.lineTo(ox, -p.len/2 + p.len*t);
        }
        serpCtx.strokeStyle = p.color;
        serpCtx.lineWidth   = p.width;
        serpCtx.lineCap     = 'round';
        serpCtx.shadowColor = p.color;
        serpCtx.shadowBlur  = 6;
        serpCtx.stroke();
        // Reflejo blanco encima
        serpCtx.strokeStyle = 'rgba(255,255,255,0.3)';
        serpCtx.lineWidth   = p.width * 0.35;
        serpCtx.shadowBlur  = 0;
        serpCtx.stroke();
      } else {
        // Confetti pequeño
        serpCtx.beginPath();
        serpCtx.ellipse(0, 0, p.width/2, p.width/3, 0, 0, Math.PI*2);
        serpCtx.fillStyle   = p.color;
        serpCtx.shadowColor = p.color;
        serpCtx.shadowBlur  = 6;
        serpCtx.fill();
      }
      serpCtx.restore();
    }

    frame++;
    if(anyAlive && frame < 350){
      serpRAF = requestAnimationFrame(loop);
    } else {
      serpCtx.clearRect(0, 0, serpCanvas.width, serpCanvas.height);
      serpRAF = null;
    }
  }
  loop();
}
