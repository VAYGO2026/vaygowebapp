<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Restaurants — VAYGO</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #060E1C;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
    }

    /* ── Contenedor principal — igual que .app en app.html ── */
    .app {
      width: 390px;
      height: 100dvh;
      max-height: 844px;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      background: url('./fondo-restaurant.webp') center center / cover no-repeat;
    }

    /* Overlay oscuro con vignette */
    .app::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          rgba(5, 12, 5, 0.55) 0%,
          rgba(5, 12, 5, 0.10) 28%,
          rgba(5, 12, 5, 0.05) 48%,
          rgba(5, 12, 5, 0.20) 65%,
          rgba(5, 12, 5, 0.60) 82%,
          rgba(5, 12, 5, 0.88) 100%
        );
      z-index: 1;
      pointer-events: none;
    }

    /* Vignette lateral */
    .app::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(5,12,5,0.45) 100%);
      z-index: 2;
      pointer-events: none;
    }

    /* ── Cards wrapper ── */
    .cards-wrap {
      position: absolute;
      top: 53%;
      left: 0;
      right: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 0 18px;
    }

    /* ── Glassmorphism card ── */
    .card {
      white-space: nowrap;
      background: rgba(10, 18, 10, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 16px;
      padding: 14px 18px;
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255,255,255,0.08);
      cursor: pointer;
      transition: background 0.13s;
    }

    .card:active {
      background: rgba(15, 25, 15, 0.68);
    }

    .card-name {
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 1px;
      letter-spacing: 0.1px;
    }

    .card-desc {
      font-size: 12px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.70);
      letter-spacing: 0.1px;
    }

    /* ── Responsive: pantallas menores a 390px — igual que app.html ── */
    @media (max-width: 430px) {
      .app {
        width: 100%;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="app">

    <div class="cards-wrap">

      <div class="card">
        <div class="card-name">The Original Lobster House</div>
        <div class="card-desc">Seafood clásico premium</div>
      </div>

      <div class="card">
        <div class="card-name">Buccanos</div>
        <div class="card-desc">Beach luxury / Sunset Club</div>
      </div>

      <div class="card">
        <div class="card-name">Azul Madera</div>
        <div class="card-desc">Mexican-Mediterranean Fusion</div>
      </div>

      <div class="card">
        <div class="card-name">Guido's</div>
        <div class="card-desc">Italian Mediterranean Timeless Classic</div>
      </div>

    </div>

  </div>
</body>
</html>
