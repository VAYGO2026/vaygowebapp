<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>VAYGO — Explore</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=Anton&family=Righteous&family=Pacifico&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;
  background:#060E1C;
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Sans',sans-serif;
}

.app{
  width:390px;
  height:100dvh;
  max-height:844px;
  border-radius:32px;
  overflow:hidden;
  position:relative;
  background: url('./fondo-app.webp') center top / cover no-repeat;
}

/* Overlay oscuro sobre la imagen para contraste */
.app::before{
  content:'';
  position:absolute;
  inset:0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.15) 0%,
    rgba(0,0,0,0.05) 30%,
    rgba(0,0,0,0.35) 70%,
    rgba(0,0,0,0.6) 100%
  );
  z-index:1;
  pointer-events:none;
}

/* ── Status Bar ── */
.status-bar{
  position:absolute;top:0;left:0;right:0;
  z-index:10;
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 24px 0;
  color:#fff;font-size:13px;font-weight:600;
}

/* ── Header text block ── */
.header-block {
  position: absolute;
  top: 0;
  left: 0; right: 0;
  z-index: 10;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding-top: 52px;
}

.h-sun {
  width: 34px;
  margin-bottom: 10px;
  opacity: 0.95;
}

.h-top {
  font-family: 'Righteous', sans-serif;
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.88);
  text-shadow: 0 1px 14px rgba(0,0,0,0.9);
}

.h-script {
  font-family: 'Pacifico', cursive;
  font-size: 52px;
  font-weight: 400;
  color: #d4f56a;
  line-height: 1.1;
  margin-top: 2px;
  text-shadow: 0 2px 20px rgba(0,0,0,0.85), 0 0 40px rgba(140,210,40,0.3);
}

.h-bottom {
  font-family: 'Righteous', sans-serif;
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 6px;
  text-transform: uppercase;
  color: #fff;
  text-shadow: 0 1px 14px rgba(0,0,0,0.9);
  margin-top: 4px;
}

/* ── Grid de botones ── */
.grid-wrap{
  position:absolute;
  top:42%;
  left:0;right:0;
  z-index:10;
  padding:0 18px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.row{
  display:flex;
  gap:10px;
  justify-content:center;
}

/* Animación flotante */
@keyframes float{
  0%,100%{ transform:translateY(0px); }
  50%{     transform:translateY(-6px); }
}

/* ── @property for neon rotation ── */
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

@keyframes rotateBorder {
  from { --angle: 0deg; }
  to   { --angle: 360deg; }
}

/* ── Botones glassmorphism + neon border ── */
.btn{
  flex:1;
  aspect-ratio:1/1;
  border-radius:18px;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:6px;
  background: rgba(0,0,0,0.38);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  border: 1px solid rgba(255,255,255,0.12);
  transition:transform 0.13s, background 0.13s;
  padding:8px 4px;
  position: relative;
  animation: float 3s ease-in-out infinite;
  overflow: hidden;
}

/* Neon ring via ::before — only on perimeter */
.btn::before {
  content: '';
  position: absolute;
  inset: -3px;
  border-radius: 21px;
  padding: 3px;
  background: conic-gradient(
    from var(--angle),
    transparent 0deg,
    transparent 50deg,
    rgba(180,220,80,0.4) 75deg,
    rgba(220,255,100,0.85) 105deg,
    rgba(255,255,180,1.00) 125deg,
    rgba(220,255,100,0.85) 145deg,
    rgba(180,220,80,0.4) 170deg,
    transparent 195deg,
    transparent 360deg
  );
  -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
  -webkit-mask-composite: xor;
  mask-composite: exclude;
  animation: rotateBorder 1.8s linear infinite;
  pointer-events: none;
  z-index: 2;
}

.btn > * { position: relative; z-index: 3; }

/* Stagger float + neon per button */
.row:nth-child(1) .btn:nth-child(1){ animation-delay:0.0s; }
.row:nth-child(1) .btn:nth-child(1)::before{ animation-delay:0.00s; }
.row:nth-child(1) .btn:nth-child(2){ animation-delay:0.4s; }
.row:nth-child(1) .btn:nth-child(2)::before{ animation-delay:0.45s; }
.row:nth-child(1) .btn:nth-child(3){ animation-delay:0.8s; }
.row:nth-child(1) .btn:nth-child(3)::before{ animation-delay:0.90s; }
.row:nth-child(1) .btn:nth-child(4){ animation-delay:1.2s; }
.row:nth-child(1) .btn:nth-child(4)::before{ animation-delay:1.35s; }
.row:nth-child(2) .btn:nth-child(1){ animation-delay:0.2s; }
.row:nth-child(2) .btn:nth-child(1)::before{ animation-delay:0.225s; }
.row:nth-child(2) .btn:nth-child(2){ animation-delay:0.6s; }
.row:nth-child(2) .btn:nth-child(2)::before{ animation-delay:0.675s; }
.row:nth-child(2) .btn:nth-child(3){ animation-delay:1.0s; }
.row:nth-child(2) .btn:nth-child(3)::before{ animation-delay:1.125s; }
.row:nth-child(2) .btn:nth-child(4){ animation-delay:1.4s; }
.row:nth-child(2) .btn:nth-child(4)::before{ animation-delay:1.575s; }

.btn:active{
  transform:scale(0.93);
  background:rgba(0,0,0,0.55);
  animation-play-state:paused;
}
.btn svg{
  width:36px;height:36px;
  filter:drop-shadow(0 1px 4px rgba(0,0,0,0.4));
}
.btn span{
  font-family:'DM Sans',sans-serif;
  font-size:10px;
  font-weight:800;
  color:#fff;
  letter-spacing:0.12em;
  text-transform:uppercase;
  text-shadow:0 1px 4px rgba(0,0,0,0.7);
}

/* ── Bottom Nav Bar ── */
.bottom-nav {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  z-index: 30;
  height: 72px;
  background: #d4f56a;
  backdrop-filter: blur(20px) saturate(1.4);
  -webkit-backdrop-filter: blur(20px) saturate(1.4);
  border-top: 1px solid rgba(212, 245, 106, 0.25);
  display: flex;
  align-items: center;
  justify-content: space-around;
  padding: 0 4px 8px;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  text-decoration: none;
  padding: 6px 2px;
  border-radius: 12px;
  transition: transform 0.15s;
  background: none;
  border: none;
}

.nav-item:active { transform: scale(0.88); }

.nav-icon {
  width: 24px; height: 24px;
  display: flex; align-items: center; justify-content: center;
}

.nav-icon svg { width: 22px; height: 22px; }

.nav-label {
  font-family: 'DM Sans', sans-serif;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  line-height: 1.2;
  text-align: center;
}

/* Per-icon neon colors */
.nav-city   .nav-icon svg { filter: none; }
.nav-city   .nav-label    { color: #000000; }

.nav-join   .nav-icon svg { filter: none; }
.nav-join   .nav-label    { color: #000000; }

.nav-ig     .nav-icon svg { filter: none; }
.nav-ig     .nav-label    { color: #000000; font-size: 7px; }

.nav-rate   .nav-icon svg { filter: none; }
.nav-rate   .nav-label    { color: #000000; }

.nav-qr     .nav-icon svg { filter: none; }
.nav-qr     .nav-label    { color: #000000; }

/* Modal JOIN */
.modal-overlay {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 50;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(8px);
  align-items: center;
  justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal-box {
  width: 88%;
  background: rgba(8,15,30,0.95);
  border: 1px solid rgba(220,80,255,0.3);
  border-radius: 20px;
  padding: 24px 20px;
  box-shadow: 0 0 40px rgba(220,80,255,0.2);
}

.modal-title {
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  text-align: center;
  margin-bottom: 4px;
  letter-spacing: 0.05em;
}

.modal-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  color: rgba(255,255,255,0.5);
  text-align: center;
  margin-bottom: 18px;
  letter-spacing: 0.04em;
}

.modal-input {
  width: 100%;
  background: rgba(255,255,255,0.07);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  padding: 10px 14px;
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  margin-bottom: 10px;
  outline: none;
}
.modal-input::placeholder { color: rgba(255,255,255,0.3); }
.modal-input:focus { border-color: rgba(220,80,255,0.6); }

.modal-submit {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: linear-gradient(135deg, #dc50ff, #7b2fff);
  color: #fff;
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.1em;
  cursor: pointer;
  margin-top: 4px;
  box-shadow: 0 0 20px rgba(220,80,255,0.4);
}

.modal-close {
  display: block;
  text-align: center;
  margin-top: 12px;
  color: rgba(255,255,255,0.35);
  font-size: 11px;
  font-family: 'DM Sans', sans-serif;
  cursor: pointer;
  letter-spacing: 0.08em;
}

/* QR modal */
.qr-box {
  border-color: rgba(80,255,160,0.3);
  box-shadow: 0 0 40px rgba(80,255,160,0.15);
  text-align: center;
}
.qr-canvas {
  margin: 16px auto;
  display: block;
  border-radius: 10px;
  background: #fff;
  padding: 10px;
}
.qr-link {
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  color: #000000;
  word-break: break-all;
  margin-top: 8px;
}

/* ── Responsive ── */
@media(max-width:430px){
  .app{ width:100%; border-radius:0; }
}
</style>
</head>
<body>

      <input class="modal-input" type="email" placeholder="Email"/>
      <button class="modal-submit">SEND REQUEST</button>
      <span class="modal-close" onclick="document.getElementById('joinModal').classList.remove('open')">✕ &nbsp;Close</span>
    </div>
  </div>

  <!-- ── QR MODAL ── -->
  <div class="modal-overlay" id="qrModal">
    <div class="modal-box qr-box">
      <div class="modal-title">Share VAYGO</div>
      <div class="modal-sub">Scan or copy the link</div>
      <canvas class="qr-canvas" id="qrCanvas" width="160" height="160"></canvas>
      <div class="qr-link" id="qrLink"></div>
      <button class="modal-submit" style="background:linear-gradient(135deg,#50ffa0,#00c97a);box-shadow:0 0 20px rgba(80,255,160,0.4)" onclick="navigator.share ? navigator.share({url: window.location.href}) : navigator.clipboard.writeText(window.location.href)">
        SHARE LINK
      </button>
      <span class="modal-close" onclick="document.getElementById('qrModal').classList.remove('open')">✕ &nbsp;Close</span>
    </div>
  </div>

</div>

<script>
/* ── QR Modal ── */
function drawQR(){
  const url = window.location.href;
  document.getElementById('qrLink').textContent = url;
  const canvas = document.getElementById('qrCanvas');
  const ctx = canvas.getContext('2d');
  const img = new Image();
  img.crossOrigin = 'anonymous';
  img.src = 'https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=' + encodeURIComponent(url);
  img.onload = () => ctx.drawImage(img, 0, 0, 160, 160);
}
document.getElementById('qrModal').addEventListener('click', e => { if(e.target===e.currentTarget) e.currentTarget.classList.remove('open'); });
document.getElementById('joinModal').addEventListener('click', e => { if(e.target===e.currentTarget) e.currentTarget.classList.remove('open'); });
window.addEventListener('load', drawQR);
</script>

<script>
/* ══ SONIDO AMBIENTAL TROPICAL ══ */
let started = false;

function startAmbient(){
  if(started) return;
  started = true;

  const ac = new (window.AudioContext || window.webkitAudioContext)();
  const SR = ac.sampleRate;
  const master = ac.createGain();
  master.gain.value = 0;
  master.connect(ac.destination);
  master.gain.linearRampToValueAtTime(1.0, ac.currentTime + 3);

  /* ── OLAS DEL MAR ── */
  function makeOcean(){
    const bufLen = SR * 8;
    const buf = ac.createBuffer(2, bufLen, SR);
    for(let ch=0; ch<2; ch++){
      const d = buf.getChannelData(ch);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<bufLen;i++){
        const w = Math.random()*2-1;
        b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
        b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
        b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
        d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
        b6=w*0.115926;
      }
    }
    const src = ac.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=800; lp.Q.value=0.5;
    const lfo = ac.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.16;
    const lfoG = ac.createGain(); lfoG.gain.value=0.35;
    lfo.connect(lfoG);
    const g = ac.createGain(); g.gain.value=0.55;
    lfoG.connect(g.gain);
    src.connect(lp); lp.connect(g); g.connect(master);
    lfo.start(); src.start();
  }
  makeOcean();

  /* ── PÁJAROS TROPICALES ── */
  function chirp(t, freq1, freq2, dur, vol){
    const osc = ac.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(freq1, t);
    osc.frequency.exponentialRampToValueAtTime(freq2, t + dur*0.6);
    osc.frequency.exponentialRampToValueAtTime(freq1*0.9, t + dur);
    const vib = ac.createOscillator(); vib.type='sine'; vib.frequency.value=18;
    const vibG = ac.createGain(); vibG.gain.value=freq1*0.03;
    vib.connect(vibG); vibG.connect(osc.frequency);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    osc.connect(g); g.connect(master);
    vib.start(t); vib.stop(t + dur + 0.1);
    osc.start(t); osc.stop(t + dur + 0.1);
  }

  function trill(t, baseFreq, notes, vol){
    notes.forEach((f, i) => {
      chirp(t + i*0.07, baseFreq*f, baseFreq*f*1.3, 0.06, vol);
    });
  }

  function bird1(t){
    trill(t, 1800, [1, 1.2, 1.4, 1.2, 1], 0.14);
    trill(t + 0.5, 2200, [1, 0.9, 1.1], 0.10);
    const next = t + 4 + Math.random()*5;
    if(next < ac.currentTime + 300) setTimeout(()=> bird1(next), (next - ac.currentTime)*1000);
  }

  function bird2(t){
    chirp(t,      900,  1400, 0.4,  0.12);
    chirp(t+0.45, 1400, 900,  0.35, 0.10);
    chirp(t+0.85, 1100, 1600, 0.3,  0.08);
    const next = t + 7 + Math.random()*8;
    if(next < ac.currentTime + 300) setTimeout(()=> bird2(next), (next - ac.currentTime)*1000);
  }

  function bird3(t){
    for(let i=0;i<6;i++) chirp(t + i*0.09, 2800+i*80, 3200, 0.07, 0.09);
    const next = t + 3 + Math.random()*4;
    if(next < ac.currentTime + 300) setTimeout(()=> bird3(next), (next - ac.currentTime)*1000);
  }

  const now = ac.currentTime;
  bird1(now + 2);
  bird2(now + 4);
  bird3(now + 1.5);
}

document.addEventListener('click',     startAmbient, {once:true});
document.addEventListener('touchstart', startAmbient, {once:true});
window.addEventListener('load', ()=>{ try{ startAmbient(); }catch(e){} });
</script>
