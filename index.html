<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>VAYGO — Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  width:100%;height:100%;
  background:#060E1C;
  display:flex;align-items:center;justify-content:center;
  font-family:'DM Sans',sans-serif;
}

.app{
  width:390px;
  height:100dvh;
  max-height:844px;
  border-radius:32px;
  overflow:hidden;
  position:relative;
  /* IMAGEN COMPLETA DE FONDO */
  background: url("fondo-inicio.webp") center top / cover no-repeat;
}

/* Gradiente suave solo en la parte baja para que los botones se lean mejor */
.app::after{
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;
  height:55%;
  background: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.35) 100%);
  pointer-events:none;
  z-index:0;
}

/* BOTONES — pegados al fondo */
.cities{
  position:absolute;
  bottom:auto;
  top:52%;
  left:28px;right:28px;
  z-index:10;
  display:flex;
  flex-direction:column;
  gap:11px;
}

.city-btn{
  width:100%;
  position:relative;
  border:none;
  border-radius:50px;
  padding:10px 20px;
  cursor:pointer;
  font-family:'DM Sans',sans-serif;
  font-size:15px;
  font-weight:700;
  color:#fff;
  text-align:center;
  letter-spacing:0.03em;
  overflow:hidden;
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(3px);
  -webkit-backdrop-filter: blur(3px);
  border: 1px solid rgba(255,255,255,0.28);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.20);
  transition: transform 0.14s, background 0.14s;
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
}

.city-btn::before{ display:none; }

.city-btn:active{
  transform:scale(0.97);
  background:rgba(255,255,255,0.15);
}

.city-btn.coming{
  background: rgba(255,255,255,0.04);
  border-color: rgba(255,255,255,0.15);
  color: rgba(255,255,255,0.45);
  cursor: default;
}
.city-btn.coming:active{ transform:none; }

.next-tag{
  font-size:10px;
  font-weight:800;
  color:#FFD700;
  letter-spacing:0.14em;
  margin-left:6px;
  vertical-align:middle;
  text-shadow: 0 0 8px rgba(255,215,0,0.8);
}
@keyframes tapPulse{
  0%,100%{opacity:1;transform:translateY(0);}
  50%{opacity:0.6;transform:translateY(-6px);}
}
</style>
</head>
<body>
<div class="app">

  <!-- Solo los botones, el resto ya viene en la imagen -->
  <div class="cities">
    <button class="city-btn" onclick="location.href='app.html?city=cozumel'">Cozumel</button>
    <button class="city-btn coming" disabled>Playa del Carmen <span class="next-tag">NEXT</span></button>
    <button class="city-btn coming" disabled>Tulum <span class="next-tag">NEXT</span></button>
    <button class="city-btn coming" disabled>Bacalar <span class="next-tag">NEXT</span></button>
    <button class="city-btn coming" disabled>Cancún <span class="next-tag">NEXT</span></button>
  </div>

</div>

<script>
/* ══ AUDIO AMBIENTAL TROPICAL — igual estilo que la app ══ */
let _ac = null;

function playIntro(){
  _ac = new (window.AudioContext || window.webkitAudioContext)();
  const SR  = _ac.sampleRate;
  const now = _ac.currentTime;

  // Master gain con fade in
  const master = _ac.createGain();
  master.gain.setValueAtTime(0, now);
  master.gain.linearRampToValueAtTime(0.9, now + 2.5);
  master.connect(_ac.destination);

  /* ── Ruido rosa — brisa y mar suave ── */
  function makePinkNoise(dur){
    const len = Math.ceil(SR * dur);
    const buf = _ac.createBuffer(2, len, SR);
    for(let ch=0;ch<2;ch++){
      const d = buf.getChannelData(ch);
      let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
      for(let i=0;i<len;i++){
        const w = Math.random()*2-1;
        b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
        b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
        b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
        d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11;
        b6=w*0.115926;
      }
    }
    return buf;
  }

  // Olas suaves con LFO
  const oceanSrc = _ac.createBufferSource();
  oceanSrc.buffer = makePinkNoise(10);
  oceanSrc.loop = true;
  const oceanFlt = _ac.createBiquadFilter(); oceanFlt.type='lowpass'; oceanFlt.frequency.value=700;
  const lfo = _ac.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.14;
  const lfoG = _ac.createGain(); lfoG.gain.value=0.28;
  lfo.connect(lfoG);
  const oceanG = _ac.createGain(); oceanG.gain.value=0.45;
  lfoG.connect(oceanG.gain);
  oceanSrc.connect(oceanFlt); oceanFlt.connect(oceanG); oceanG.connect(master);
  lfo.start(); oceanSrc.start();

  /* ── Pájaros tropicales ── */
  function chirp(t, f1, f2, dur, vol){
    const o = _ac.createOscillator(); o.type='sine';
    o.frequency.setValueAtTime(f1, t);
    o.frequency.exponentialRampToValueAtTime(f2, t+dur*0.6);
    o.frequency.exponentialRampToValueAtTime(f1*0.9, t+dur);
    const vib = _ac.createOscillator(); vib.type='sine'; vib.frequency.value=20;
    const vibG = _ac.createGain(); vibG.gain.value=f1*0.025;
    vib.connect(vibG); vibG.connect(o.frequency);
    const g = _ac.createGain();
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.001,t+dur);
    o.connect(g); g.connect(master);
    vib.start(t); vib.stop(t+dur+0.1);
    o.start(t); o.stop(t+dur+0.1);
  }

  function trill(t, base, notes, vol){
    notes.forEach((f,i) => chirp(t+i*0.07, base*f, base*f*1.3, 0.06, vol));
  }

  function bird1(t){ trill(t,1800,[1,1.2,1.4,1.2,1],0.13); trill(t+0.5,2200,[1,0.9,1.1],0.09); schedule(bird1, t, 4, 5); }
  function bird2(t){ chirp(t,900,1400,0.4,0.11); chirp(t+0.45,1400,900,0.35,0.09); chirp(t+0.85,1100,1600,0.3,0.07); schedule(bird2, t, 7, 8); }
  function bird3(t){ for(let i=0;i<6;i++) chirp(t+i*0.09,2800+i*80,3200,0.07,0.08); schedule(bird3, t, 3, 4); }

  function schedule(fn, t, minGap, maxGap){
    const next = t + minGap + Math.random()*maxGap;
    setTimeout(()=> fn(next), (next - _ac.currentTime)*1000);
  }

  bird1(now + 1.5);
  bird2(now + 3.5);
  bird3(now + 1.0);
}

// Bucle del audio — reinicia cada 12s
let loopTimer = null;
function loopIntro(){
  playIntro();
  loopTimer = setTimeout(loopIntro, 12000);
}

// Arrancar al primer toque en cualquier parte
document.addEventListener('click',    loopIntro, {once:true});
document.addEventListener('touchstart', loopIntro, {once:true});
</script>

</body>
</html>
