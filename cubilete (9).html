<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>VAYGO — Dice Challenge</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;touch-action:none;font-family:'DM Sans',sans-serif;}
.app{width:100%;max-width:430px;height:100dvh;margin:0 auto;position:relative;display:flex;flex-direction:column;background:#000;}

/* HEADER */
.hdr{height:54px;background:rgba(0,0,0,0.95);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;z-index:20;border-bottom:1px solid rgba(201,168,76,0.15);}
.back{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;text-decoration:none;}
.logo-n{font-family:'Anton',sans-serif;font-size:18px;color:#C9A84C;letter-spacing:4px;text-align:center;}
.logo-s{font-size:7px;color:rgba(255,255,255,0.35);letter-spacing:2px;text-align:center;}
.rolls-box{background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:4px 10px;text-align:center;}
.rolls-lbl{font-size:7px;color:rgba(255,255,255,0.4);letter-spacing:0.1em;display:block;margin-bottom:3px;}
.rolls-dots{display:flex;gap:4px;justify-content:center;}
.rdot{width:12px;height:12px;border-radius:50%;background:#C9A84C;box-shadow:0 0 5px #C9A84C;transition:all 0.3s;}
.rdot.used{background:#222;box-shadow:none;}

/* GAME */
.game{flex:1;position:relative;overflow:hidden;background:#000;}

/* STATUS */
.status{position:absolute;top:14px;left:0;right:0;text-align:center;z-index:10;pointer-events:none;}
.st-title{font-family:'Anton',sans-serif;font-size:18px;color:#fff;letter-spacing:2px;}
.st-sub{font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px;letter-spacing:1px;}

/* CUP */
#cup{
  position:absolute;
  left:50%;top:10%;
  transform:translateX(-50%);
  width:88%;max-width:340px;
  z-index:8;cursor:pointer;
}
#cupImg{width:100%;display:block;}

/* HINT */
#hint{
  position:absolute;bottom:18px;left:0;right:0;
  text-align:center;z-index:10;
  font-size:11px;color:rgba(0,207,255,0.8);
  letter-spacing:2px;text-transform:uppercase;
  animation:blink 1.5s infinite;
}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* CUP shake */
@keyframes cupShake{
  0%  {transform:translateX(-50%) rotate(0deg) translateY(0);}
  12% {transform:translateX(calc(-50% - 20px)) rotate(-11deg) translateY(-10px);}
  25% {transform:translateX(calc(-50% + 20px)) rotate(11deg) translateY(-14px);}
  37% {transform:translateX(calc(-50% - 15px)) rotate(-8deg) translateY(-8px);}
  50% {transform:translateX(calc(-50% + 15px)) rotate(8deg) translateY(-12px);}
  62% {transform:translateX(calc(-50% - 8px)) rotate(-4deg) translateY(-5px);}
  75% {transform:translateX(calc(-50% + 8px)) rotate(4deg) translateY(-8px);}
  100%{transform:translateX(-50%) rotate(0deg) translateY(0);}
}
.shaking{animation:cupShake 0.65s ease-in-out;}

/* DICE */
.die{
  position:absolute;
  width:80px;height:80px;
  object-fit:contain;
  z-index:5;opacity:0;
  pointer-events:none;
}
.die.prize-die{width:80px;height:80px;z-index:15;}

@keyframes fly0{0%{opacity:0;transform:translate(0,0) scale(0.2) rotate(0);}20%{opacity:1;}100%{opacity:1;transform:translate(-120px,80px) scale(1) rotate(-30deg);}}
@keyframes fly1{0%{opacity:0;transform:translate(0,0) scale(0.2) rotate(0);}20%{opacity:1;}100%{opacity:1;transform:translate(-50px,100px) scale(1) rotate(18deg);}}
@keyframes fly2{0%{opacity:0;transform:translate(0,0) scale(0.2) rotate(0);}20%{opacity:1;}100%{opacity:1;transform:translate(0px,110px) scale(1) rotate(-8deg);}}
@keyframes fly3{0%{opacity:0;transform:translate(0,0) scale(0.2) rotate(0);}20%{opacity:1;}100%{opacity:1;transform:translate(50px,100px) scale(1) rotate(22deg);}}
@keyframes fly4{0%{opacity:0;transform:translate(0,0) scale(0.2) rotate(0);}20%{opacity:1;}100%{opacity:1;transform:translate(120px,80px) scale(1) rotate(-28deg);}}

.fly0{animation:fly0 0.7s cubic-bezier(0.2,0.8,0.3,1) forwards;}
.fly1{animation:fly1 0.7s cubic-bezier(0.2,0.8,0.3,1) forwards;animation-delay:0.07s;}
.fly2{animation:fly2 0.7s cubic-bezier(0.2,0.8,0.3,1) forwards;animation-delay:0.14s;}
.fly3{animation:fly3 0.7s cubic-bezier(0.2,0.8,0.3,1) forwards;animation-delay:0.21s;}
.fly4{animation:fly4 0.7s cubic-bezier(0.2,0.8,0.3,1) forwards;animation-delay:0.28s;}

/* NAV */
.nav{height:54px;background:rgba(0,0,0,0.98);border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-around;flex-shrink:0;z-index:20;}
.ni{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;}
.ni .ico{font-size:15px;}
.ni span{font-size:7px;color:rgba(255,255,255,0.3);}
.nc{background:linear-gradient(180deg,#C9A84C,#8B6914);border-radius:50%;width:44px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;margin-top:-12px;box-shadow:0 0 0 3px #000,0 0 0 4px rgba(201,168,76,0.3);}
.nc .ico{font-size:14px;}
.nc .lbl{font-size:7px;color:#fff;font-weight:700;}

/* PRIZE MODAL */
#prizeModal{position:absolute;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.93);}
#prizeModal.show{display:flex;animation:fadeIn 0.35s ease;}
@keyframes fadeIn{from{opacity:0;transform:scale(0.9);}to{opacity:1;transform:scale(1);}}
.pbox{background:#050005;border-radius:24px;padding:30px 24px;text-align:center;width:300px;border:2px solid #C9A84C;box-shadow:0 0 60px rgba(201,168,76,0.25);}
.pwin-lbl{font-size:10px;color:#00CFFF;text-transform:uppercase;letter-spacing:3px;margin-bottom:14px;}
.prize-img-wrap{width:130px;height:130px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;}
.prize-img-wrap img{width:100%;animation:prizePulse 1.5s infinite;}
@keyframes prizePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.pval{font-family:'Anton',sans-serif;font-size:56px;line-height:1;margin-bottom:6px;}
.pdesc{font-size:12px;color:rgba(255,255,255,0.4);margin-bottom:22px;}
.pbtn{background:linear-gradient(180deg,#C9A84C,#8B6914);border:none;border-radius:50px;padding:14px 0;color:#fff;font-family:'Anton',sans-serif;font-size:16px;letter-spacing:2px;cursor:pointer;width:100%;box-shadow:0 4px 0 #5A4008;}

.confetti-piece{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:200;animation:cFall linear forwards;}
@keyframes cFall{0%{opacity:1;transform:translateY(0) rotate(0);}100%{opacity:0;transform:translateY(100vh) rotate(540deg);}}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <a href="app.html" class="back">&#8249;</a>
    <div><div class="logo-n">VAYGO</div><div class="logo-s">DICE CHALLENGE</div></div>
    <div class="rolls-box">
      <span class="rolls-lbl">ROLLS</span>
      <div class="rolls-dots">
        <div class="rdot" id="d0"></div>
        <div class="rdot" id="d1"></div>
        <div class="rdot" id="d2"></div>
      </div>
    </div>
  </div>

  <div class="game" id="game">
    <div class="status">
      <div class="st-title" id="stTitle">SHAKE THE CUP!</div>
      <div class="st-sub" id="stSub">Tap the cup or shake your phone</div>
    </div>

    <img class="die" id="die0" src=""/>
    <img class="die" id="die1" src=""/>
    <img class="die" id="die2" src=""/>
    <img class="die" id="die3" src=""/>
    <img class="die" id="die4" src=""/>

    <div id="cup" onclick="handleTap()">
      <img id="cupImg" src="" alt=""/>
    </div>

    <div id="hint">👆 TAP OR SHAKE TO ROLL</div>
  </div>

  <div class="nav">
    <div class="ni"><div class="ico">🧭</div><span>EXPLORE</span></div>
    <div class="ni"><div class="ico">🎁</div><span>REWARDS</span></div>
    <div class="nc"><div class="ico">🏆</div><div class="lbl">PLAY</div></div>
    <div class="ni"><div class="ico">📍</div><span>MAP</span></div>
    <div class="ni"><div class="ico">👤</div><span>PROFILE</span></div>
  </div>

  <div id="prizeModal">
    <div class="pbox">
      <div class="pwin-lbl">🎉 YOU WIN!</div>
      <div class="prize-img-wrap"><img id="prizeDieImg" src="" alt=""/></div>
      <div class="pval" id="pval"></div>
      <div class="pdesc" id="pdesc"></div>
      <button class="pbtn" onclick="closePrize()">AWESOME! 🎉</button>
    </div>
  </div>
</div>

};

const NORMAL_DICE = [IMGS.dado_b1, IMGS.dado_b2, IMGS.dado_b3, IMGS.dado_b4, IMGS.dado_b5];
const PRIZES = [
  {img:IMGS.dado_10, label:'10% OFF', desc:'10% off your total bill', color:'#FF2D9B'},
  {img:IMGS.dado_15, label:'15% OFF', desc:'15% off your total bill', color:'#33DD33'},
  {img:IMGS.dado_20, label:'20% OFF', desc:'20% off your total bill', color:'#3A7FFF'},
];

document.getElementById('cupImg').src = IMGS.cubilete;

function positionDice(){
  const game = document.getElementById('game');
  const cup  = document.getElementById('cup');
  const gw   = game.clientWidth;
  const cupBottom = cup.offsetTop + cup.offsetHeight - 60;
  for(let i=0;i<5;i++){
    const el = document.getElementById('die'+i);
    el.style.left = (gw/2 - 42) + 'px';
    el.style.top  = cupBottom + 'px';
  }
}
window.addEventListener('load', positionDice);
window.addEventListener('resize', positionDice);
setTimeout(positionDice, 300);

let tiro=0, animating=false, gameOver=false;
let lastShake=0, shakeCount=0;

if(window.DeviceMotionEvent){
  window.addEventListener('devicemotion', e=>{
    const a = e.accelerationIncludingGravity;
    if(!a) return;
    const mag = Math.sqrt(a.x*a.x + a.y*a.y + a.z*a.z);
    const now = Date.now();
    if(mag > 18 && now - lastShake > 350){
      lastShake = now; shakeCount++;
      if(shakeCount >= 2){ shakeCount=0; handleTap(); }
    }
  });
}
if(typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function'){
  document.getElementById('game').addEventListener('click', ()=>{
    DeviceMotionEvent.requestPermission().catch(()=>{});
  },{once:true});
}

function updDots(){
  [0,1,2].forEach(i=> document.getElementById('d'+i).classList.toggle('used', i>=(3-tiro)));
}

function handleTap(){
  if(animating||gameOver) return;
  animating=true;
  const cup = document.getElementById('cup');

  if(tiro===0){
    shakeCup(()=>{
      tiro++; updDots();
      setStatus('😬 NOT YET!', 'Shake harder... the dice are waiting!');
      document.getElementById('hint').textContent='👆 TAP TO ROLL AGAIN';
      animating=false;
    });
  } else if(tiro===1){
    shakeCup(()=>{
      tiro++; updDots();
      setStatus('🔥 SO CLOSE!', 'One last roll to reveal your prize!');
      document.getElementById('hint').textContent='👆 TAP FOR THE FINAL ROLL';
      flyNormalDice();
      animating=false;
    });
  } else {
    shakeCup(()=>{
      tiro++; updDots();
      document.getElementById('hint').style.display='none';
      setStatus('🎲 REVEALING YOUR PRIZE!','');
      resetDice(()=>{ flyAllWithPrize(); });
    });
  }
}

function shakeCup(cb){
  const cup = document.getElementById('cup');
  cup.classList.add('shaking');
  cup.addEventListener('animationend', ()=>{
    cup.classList.remove('shaking');
    cb();
  },{once:true});
}

function resetDice(cb){
  for(let i=0;i<5;i++){
    const el=document.getElementById('die'+i);
    el.className='die';
    el.style.opacity='0';
  }
  positionDice();
  setTimeout(cb, 60);
}

function flyNormalDice(){
  const shuffled=[...NORMAL_DICE].sort(()=>Math.random()-0.5);
  [0,1,3,4].forEach((pos,idx)=>{
    const el=document.getElementById('die'+pos);
    el.src=shuffled[idx];
    setTimeout(()=>{ el.classList.add('fly'+pos); }, idx*70);
  });
}

function flyAllWithPrize(){
  const prize=PRIZES[Math.floor(Math.random()*PRIZES.length)];
  const shuffled=[...NORMAL_DICE].sort(()=>Math.random()-0.5);

  // 4 normal dice
  [0,1,3,4].forEach((pos,idx)=>{
    const el=document.getElementById('die'+pos);
    el.src=shuffled[idx];
    setTimeout(()=>{ el.classList.add('fly'+pos); }, idx*70);
  });

  // Prize die center — bigger, front
  const prizeEl=document.getElementById('die2');
  prizeEl.src=prize.img;
  prizeEl.classList.add('prize-die');
  setTimeout(()=>{ prizeEl.classList.add('fly2'); }, 140);

  setStatus('🎉 THAT\'S YOUR PRIZE!','The neon dice is your reward');

  setTimeout(()=>{
    showPrize(prize);
    gameOver=true;
    animating=false;
  }, 2200);
}

function setStatus(t,s){
  document.getElementById('stTitle').textContent=t;
  document.getElementById('stSub').textContent=s;
}

function showPrize(prize){
  document.getElementById('prizeDieImg').src=prize.img;
  document.getElementById('pval').textContent=prize.label;
  document.getElementById('pval').style.color=prize.color;
  document.getElementById('pdesc').textContent=prize.desc;
  document.getElementById('prizeModal').classList.add('show');
  confetti();
}

function closePrize(){
  document.getElementById('prizeModal').classList.remove('show');
}

function confetti(){
  const cols=['#C9A84C','#00CFFF','#FF2D9B','#33DD33','#3A7FFF','#fff'];
  for(let i=0;i<60;i++){
    const el=document.createElement('div');
    el.className='confetti-piece';
    el.style.left=Math.random()*100+'vw';
    el.style.background=cols[Math.floor(Math.random()*cols.length)];
    el.style.animationDuration=(1.8+Math.random()*2.5)+'s';
    el.style.animationDelay=Math.random()+'s';
    document.body.appendChild(el);
    el.addEventListener('animationend',()=>el.remove());
  }
}

updDots();
</script>
</body>
</html>
