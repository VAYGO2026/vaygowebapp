<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>VAYGO Slot</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.wrap{position:relative;display:inline-block;}
#machineImg{display:block;max-width:100vw;max-height:100dvh;object-fit:contain;}
#ui{position:absolute;display:flex;flex-direction:column;gap:0;}
#reelsRow{display:flex;gap:2%;}
.reel{flex:1;overflow:hidden;border-radius:8px;background:rgba(5,0,20,0.88);border:1px solid rgba(255,215,0,0.15);position:relative;}
.reel-inner{display:flex;flex-direction:column;}
#statsBar{display:flex;gap:2%;margin-top:2%;}
.sbox{flex:1;background:rgba(0,0,0,0.7);border:1px solid rgba(255,215,0,0.2);border-radius:4px;padding:2px 4px;text-align:center;}
.slbl{display:block;font:600 8px/1 Arial,sans-serif;color:rgba(255,215,0,0.5);letter-spacing:1px;text-transform:uppercase;margin-bottom:1px;}
.sval{display:block;font:700 12px/1 Arial,sans-serif;color:rgba(255,255,255,0.8);}
#spinWrap{margin-top:3%;}
#spinBtn{
  width:100%;height:40px;
  background:linear-gradient(180deg,#ff4444,#cc0000,#880000);
  border:none;border-radius:10px;
  color:#fff;font:700 15px/1 Arial,sans-serif;letter-spacing:3px;
  cursor:pointer;
  box-shadow:0 3px 0 #550000,0 0 16px rgba(255,0,0,0.4);
}
#spinBtn:active{transform:translateY(2px);box-shadow:0 1px 0 #550000;}
#spinBtn:disabled{opacity:0.5;cursor:not-allowed;}
.back-btn{position:fixed;top:12px;left:12px;z-index:100;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.2);display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;text-decoration:none;}

/* QR MODAL */
#qrModal{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.97);padding:16px;overflow-y:auto;}
#qrModal.show{display:flex;}
.qr-box{background:#0a0a1a;border-radius:24px;padding:24px 20px;text-align:center;width:100%;max-width:320px;border:2px solid #C9A84C;}
.qr-your-prize{font-size:10px;color:#00CFFF;text-transform:uppercase;letter-spacing:3px;margin-bottom:8px;font-family:Arial;}
.qr-prize-val{font-size:64px;line-height:1;color:#fff;margin-bottom:4px;font-family:Impact,sans-serif;}
.qr-rest-name{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:14px;font-family:Arial;}
.qr-code-pill{background:#111;border-radius:10px;padding:8px 18px;font-family:monospace;font-size:17px;font-weight:700;color:#fff;letter-spacing:2px;margin-bottom:6px;display:inline-block;}
.qr-valid-txt{font-size:12px;color:#f59e0b;font-weight:700;margin-bottom:14px;font-family:Arial;}
#qr-canvas{display:flex;justify-content:center;margin:0 auto 10px;}
.qr-hint{font-size:11px;color:rgba(255,255,255,0.35);margin-bottom:14px;font-family:Arial;}
.qr-min-box{background:rgba(245,158,11,0.1);border:1px solid rgba(245,158,11,0.3);border-radius:10px;padding:10px;font-size:11px;color:rgba(255,255,255,0.6);font-family:Arial;}
.qr-min-box strong{color:#f59e0b;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyAnfS-H1Ci1WaAnjoBTA9IJFYSklAk-okM",authDomain:"vaygo-app.firebaseapp.com",projectId:"vaygo-app",storageBucket:"vaygo-app.firebasestorage.app",appId:"vaygo-app"});
const db=firebase.firestore();
const REST_ID="lobster",REST_NAME="Lobster House",MIN_PURCHASE="$20 USD";
const PRIZES=[{label:"10% OFF",color:"#00CFFF"},{label:"15% OFF",color:"#FF2D9B"},{label:"20% OFF",color:"#FFD700"}];
function genCode(){const c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const s=n=>Array.from({length:n},()=>c[Math.floor(Math.random()*c.length)]).join('');return'VYG-'+s(4)+'-'+s(4);}
function getExpiry(){const n=new Date(),e=new Date(n);e.setHours(23,59,59,0);if(e<=n)e.setDate(e.getDate()+1);return e;}
async function saveAndShowQR(prize){
  const today=new Date().toISOString().slice(0,10),spinKey=REST_ID+'_slot_'+today;
  try{const ex=localStorage.getItem('vaygo_slot_'+REST_ID);if(ex){const d=JSON.parse(ex);if(d.spinKey===spinKey){showQR(d.code,prize.label,d.expires);return;}}}catch(e){}
  const code=genCode(),expires=getExpiry();
  try{await db.collection('codes').doc(code).set({code,prize:prize.label,restId:REST_ID,restName:REST_NAME,spinKey,spunAt:firebase.firestore.FieldValue.serverTimestamp(),expiresAt:expires.toISOString(),used:false,uid:'anon_'+Date.now(),game:'slot'});}catch(e){}
  try{localStorage.setItem('vaygo_slot_'+REST_ID,JSON.stringify({code,spinKey,expires:expires.toISOString()}));}catch(e){}
  showQR(code,prize.label,expires.toISOString());
}
function showQR(code,prize,expiresISO){
  const t=new Date(expiresISO).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('qr-prize').textContent=prize;
  document.getElementById('qr-rest').textContent=REST_NAME;
  document.getElementById('qr-code-txt').textContent=code;
  document.getElementById('qr-valid').textContent='Valid until: '+t+' today';
  const qrDiv=document.getElementById('qr-canvas');qrDiv.innerHTML='';
  new QRCode(qrDiv,{text:code,width:220,height:220,colorDark:'#000',colorLight:'#fff'});
  setTimeout(()=>{const img=qrDiv.querySelector('img');if(img){img.style.padding='10px';img.style.background='#fff';img.style.borderRadius='10px';img.style.display='block';}},100);
  document.getElementById('qrModal').classList.add('show');
}
</script>
</head>
<body>
<a href="lobster.html" class="back-btn">‹</a>
<div class="wrap">
  <img id="machineImg" src="./machine.webp" alt="VAYGO"/>
  <div id="ui">
    <div id="reelsRow">
      <div class="reel" id="r0"><div class="reel-inner" id="ri0"></div></div>
      <div class="reel" id="r1"><div class="reel-inner" id="ri1"></div></div>
      <div class="reel" id="r2"><div class="reel-inner" id="ri2"></div></div>
    </div>
    <div id="statsBar">
      <div class="sbox"><span class="slbl">Credits</span><span class="sval">1</span></div>
      <div class="sbox"><span class="slbl">Bet</span><span class="sval">MAX</span></div>
      <div class="sbox"><span class="slbl">Win</span><span class="sval" id="winVal">—</span></div>
    </div>
    <div id="spinWrap"><button id="spinBtn" onclick="spin()">SPIN NOW</button></div>
  </div>
</div>

<div id="qrModal">
  <div class="qr-box">
    <div class="qr-your-prize">🎉 YOUR PRIZE</div>
    <div class="qr-prize-val" id="qr-prize"></div>
    <div class="qr-rest-name" id="qr-rest"></div>
    <div class="qr-code-pill" id="qr-code-txt"></div>
    <div class="qr-valid-txt" id="qr-valid"></div>
    <div id="qr-canvas"></div>
    <div class="qr-hint">Show this QR to the staff</div>
    <div class="qr-min-box">⚠️ Min purchase: <strong>${MIN_PURCHASE}</strong></div>
  </div>
</div>

<script>
// Position UI over the black screen area of the machine image
// Fractions of rendered image size:
const isMobile = window.innerWidth <= 768;
const CFG = isMobile
  ? { top:0.305, left:0.130, width:0.660, height:0.330 }
  : { top:0.280, left:0.145, width:0.640, height:0.420 };

const ITEMS = [
  {pct:"10%", color:"#00CFFF"},
  {pct:"15%", color:"#FF2D9B"},
  {pct:"20%", color:"#FFD700"},
];

let ITEM_H = 80;
let spinning = false;
let done = false;

function layout(){
  const img = document.getElementById('machineImg');
  const r = img.getBoundingClientRect();
  if(r.width === 0) return;

  const W=r.width, H=r.height;
  const uiW = W * CFG.width;
  const uiH = H * CFG.height;
  const uiL = (W - uiW) / 2; // centered over image
  const uiT = H * CFG.top;

  const ui = document.getElementById('ui');
  ui.style.position = 'absolute';
  ui.style.left = uiL + 'px';
  ui.style.top  = uiT + 'px';
  ui.style.width = uiW + 'px';
  ui.style.height = uiH + 'px';

  // Reel height = 65% of ui height
  const rH = Math.floor(uiH * 0.62);
  ITEM_H = rH;
  ['r0','r1','r2'].forEach(id => document.getElementById(id).style.height = rH + 'px');

  buildReels(rH);
}

function buildReels(rH){
  const fs = Math.max(18, Math.round(rH * 0.25));
  const fo = Math.max(9,  Math.round(rH * 0.09));

  for(let r=0;r<3;r++){
    const inner = document.getElementById('ri'+r);
    inner.innerHTML = '';
    inner.style.cssText = 'display:flex;flex-direction:column;';

    // Build 4 loops of items
    const list = [...ITEMS,...ITEMS,...ITEMS,...ITEMS];
    list.forEach(item => {
      const div = document.createElement('div');
      div.style.cssText = `
        height:${rH}px;
        min-height:${rH}px;
        flex-shrink:0;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:center;
      `;
      div.innerHTML = `
        <span style="font:700 ${fs}px/1 Impact,Arial,sans-serif;color:${item.color};text-shadow:0 0 20px ${item.color};">${item.pct}</span>
        <span style="font:800 ${fo}px/1 Arial,sans-serif;color:${item.color};letter-spacing:2px;margin-top:3px;opacity:0.85;">OFF</span>
      `;
      inner.appendChild(div);
    });

    inner.style.transform = 'translateY(-'+(r*rH)+'px)';
  }
}

function spin(){
  if(spinning || done) return;
  spinning = true;
  document.getElementById('spinBtn').disabled = true;

  const prize = PRIZES[Math.floor(Math.random() * PRIZES.length)];
  const target = ITEMS.findIndex(i => i.pct === prize.label.split('%')[0]+'%');

  // Land in 3rd batch
  const landIdx = ITEMS.length * 2 + target;

  [0,1,2].forEach((r, idx) => {
    const inner = document.getElementById('ri'+r);
    const dur = 1000 + idx * 350;
    inner.style.transition = `transform ${dur}ms cubic-bezier(0.17,0.67,0.12,1.0)`;
    inner.style.transform = `translateY(-${landIdx * ITEM_H}px)`;

    setTimeout(() => {
      if(idx === 2){
        document.getElementById('winVal').textContent = prize.label;
        spinning = false;
        done = true;
        playWin();
        confetti();
        setTimeout(() => saveAndShowQR(prize), 800);
      }
    }, dur);
  });
}

// Sound
let ac;
function getAC(){if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}
function playWin(){try{const a=getAC(),n=a.currentTime;[[0,523],[.13,659],[.26,784],[.39,1047],[.52,1319]].forEach(([t,f])=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.setValueAtTime(0,n+t);g.gain.linearRampToValueAtTime(.28,n+t+.02);g.gain.exponentialRampToValueAtTime(.001,n+t+.28);o.connect(g);g.connect(a.destination);o.start(n+t);o.stop(n+t+.3);});}catch(e){}}

// Confetti
function confetti(){const cv=document.createElement('canvas');cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9999;';document.body.appendChild(cv);cv.width=innerWidth;cv.height=innerHeight;const ctx=cv.getContext('2d');const C=['#FFD700','#FF2D9B','#00CFFF','#fff'];const ps=Array.from({length:100},()=>({x:Math.random()*cv.width,y:-20,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,c:C[~~(Math.random()*C.length)],a:Math.random()*6,s:(Math.random()-.5)*.15,w:4+Math.random()*5,h:7+Math.random()*10,al:1}));(function loop(){ctx.clearRect(0,0,cv.width,cv.height);let alive=false;ps.forEach(p=>{if(p.al<=0)return;p.x+=p.vx;p.y+=p.vy;p.a+=p.s;p.vy+=.07;if(p.y>cv.height*.85)p.al-=.03;alive=true;ctx.save();ctx.globalAlpha=p.al;ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();});if(alive)requestAnimationFrame(loop);else cv.remove();})();}

// Init
const img = document.getElementById('machineImg');
img.onload = layout;
window.onresize = layout;
if(img.complete && img.naturalWidth) layout();
setTimeout(layout, 300);
setTimeout(layout, 1000);
</script>
</body>
</html>
