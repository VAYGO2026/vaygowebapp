<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=390, initial-scale=1.0" />
  <title>The Most Exclusive Spots</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 390px;
      min-height: 844px;
      margin: 0 auto;
      font-family: 'Inter', sans-serif;
      background: #0a0e0a;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 390px;
      min-height: 844px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Background */
    .bg {
      position: absolute;
      inset: 0;
      background: url('./fondo-restaurant.webp') center center / cover no-repeat;
      z-index: 0;
    }

    /* Dark overlay top and bottom to match the dark vignette */
    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom,
          rgba(5, 12, 5, 0.55) 0%,
          rgba(5, 12, 5, 0.10) 28%,
          rgba(5, 12, 5, 0.05) 48%,
          rgba(5, 12, 5, 0.20) 65%,
          rgba(5, 12, 5, 0.60) 82%,
          rgba(5, 12, 5, 0.88) 100%
        );
      z-index: 1;
    }

    /* Left/right dark edge vignette */
    .bg::after {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse at center, transparent 40%, rgba(5,12,5,0.55) 100%);
      z-index: 2;
    }

    /* Content wrapper */
    .content {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      min-height: 844px;
      padding: 220px 0 40px 0;
    }

    /* Cards list */
    .cards {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 18px 18px 0;
      width: 100%;
    }

    /* Glassmorphism card */
    .card {
      width: 100%;
      background: rgba(10, 18, 10, 0.52);
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 16px;
      padding: 11px 18px 11px;
      backdrop-filter: blur(18px) saturate(1.2);
      -webkit-backdrop-filter: blur(18px) saturate(1.2);
      box-shadow:
        0 4px 24px rgba(0, 0, 0, 0.38),
        inset 0 1px 0 rgba(255,255,255,0.08);
      cursor: pointer;
      transition: background 0.2s;
    }

    .card:active {
      background: rgba(15, 25, 15, 0.68);
    }

    .card-name {
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 3px;
      letter-spacing: 0.1px;
    }

    .card-desc {
      font-size: 13px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.70);
      margin-bottom: 0;
      letter-spacing: 0.1px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .card-rating {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      font-weight: 700;
      color: #f0c330;
    }

    .star {
      font-size: 15px;
      color: #f0c330;
      line-height: 1;
    }

    .card-price {
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.5px;
    }

    /* Spacer bottom */
    .spacer {
      height: 40px;
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="bg"></div>

    <div class="content">

      <div class="cards">

        <div class="card">
          <div class="card-name">The Original Lobster House</div>
          <div class="card-desc">Seafood clásico premium</div>
        </div>

        <div class="card">
          <div class="card-name">Buccanos</div>
          <div class="card-desc">Beach luxury / Sunset Club</div>
        </div>

        <div class="card">
          <div class="card-name">Azul Madera</div>
          <div class="card-desc">Mexican-Mediterranean Fusion</div>
        </div>

        <div class="card">
          <div class="card-name">Guido's</div>
          <div class="card-desc">Italian Mediterranean Timeless Classic</div>
        </div>

      </div>

      <div class="spacer"></div>
    </div>

  </div>
</body>
</html>
